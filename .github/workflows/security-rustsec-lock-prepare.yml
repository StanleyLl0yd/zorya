name: Security lockfile remediation preparation

on:
  push:
    branches:
      - security/rustsec-october-lock-refresh

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Update vulnerable locked crates
        run: |
          cargo update -p quinn-proto --precise 0.11.18
          cargo update -p rustls --precise 0.23.46
          cargo update -p rustls-webpki --precise 0.103.16
          cargo update -p webpki-root-certs --precise 1.0.10
      - name: Emit reviewed generated lockfile for exact commit
        run: |
          echo 'ZORYA_LOCK_BEGIN'
          cat Cargo.lock
          echo 'ZORYA_LOCK_END'
