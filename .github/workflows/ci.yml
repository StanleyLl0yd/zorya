name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  document-bookmarks-storage:
    name: Temporary bookmarks architecture update
    if: github.event_name == 'pull_request' && github.head_ref == 'z3/bookmarks-store'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Document bookmarks storage and remove this job
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/ARCHITECTURE.md")
          text = path.read_text(encoding="utf-8")
          marker = "`PreparedProfile::load` opens both recoverable settings and browsing-history state on the background/profile-worker side."
          paragraph = "Persistent bookmarks are profile-local product state with their own stable `BookmarkId` namespace, separate from tab history and Web-engine identities. `BookmarksStore` stores bounded title/location text in immutable versioned generations under the profile root, verifies the exact `ProfileLock` before write work and again immediately before no-overwrite publication, and rejects stale or concurrently-created generations. Loading scans bounded directory state newest-first, reports skipped corrupt generations explicitly, and fails closed on unsupported schemas; bookmark identifiers remain monotonic across edit, removal and clear. The storage primitive is synchronous and therefore belongs on profile/background workers; loading into `PreparedProfile`, runtime dirty/save coordination and native bookmarks UX are later Z3 work."
          if paragraph in text:
              raise SystemExit("bookmarks architecture paragraph already present")
          if marker not in text:
              raise SystemExit("bookmarks architecture insertion marker not found")
          text = text.replace(marker, paragraph + "\n\n" + marker, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "docs: define bookmarks storage boundary"
          git push origin HEAD:${{ github.head_ref }}

  windows:
    name: Windows primary
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Build developer executable
        run: cargo build --locked --bin zorya
      - name: Smoke test developer executable
        run: .\\target\\debug\\zorya.exe --version
      - name: Smoke test native shell
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\\target\\debug\\zorya.exe" -ArgumentList "--native-smoke" -PassThru -NoNewWindow
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw "native shell smoke test timed out"
          }
          if ($process.ExitCode -ne 0) {
            throw "native shell smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Smoke test presentation-safe tab activation
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\\target\\debug\\zorya.exe" -ArgumentList "--native-tab-activation-smoke" -PassThru -NoNewWindow
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw "native tab activation smoke test timed out"
          }
          if ($process.ExitCode -ne 0) {
            throw "native tab activation smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Smoke test presentation-safe tab close
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\\target\\debug\\zorya.exe" -ArgumentList "--native-tab-close-smoke" -PassThru -NoNewWindow
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw "native tab close smoke test timed out"
          }
          if ($process.ExitCode -ne 0) {
            throw "native tab close smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Smoke test rapid tab activation supersession
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\\target\\debug\\zorya.exe" -ArgumentList "--native-tab-supersession-smoke" -PassThru -NoNewWindow
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw "native tab supersession smoke test timed out"
          }
          if ($process.ExitCode -ne 0) {
            throw "native tab supersession smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Smoke test real HTTP navigation
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\\target\\debug\\zorya.exe" -ArgumentList "--native-http-navigation-smoke" -PassThru -NoNewWindow
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw "native HTTP navigation smoke test timed out"
          }
          if ($process.ExitCode -ne 0) {
            throw "native HTTP navigation smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Smoke test native profile cycle
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\\target\\debug\\zorya.exe" -ArgumentList "--native-profile-cycle-smoke" -PassThru -NoNewWindow
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw "native profile cycle smoke test timed out"
          }
          if ($process.ExitCode -ne 0) {
            throw "native profile cycle smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Smoke test native color-scheme profile setting
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\\target\\debug\\zorya.exe" -ArgumentList "--native-color-scheme-smoke" -PassThru -NoNewWindow
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw "native color-scheme smoke test timed out"
          }
          if ($process.ExitCode -ne 0) {
            throw "native color-scheme smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Upload developer executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zorya-windows-dev-${{ github.sha }}
          path: target/debug/zorya.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up MSRV
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
      - name: Check MSRV
        run: cargo check --locked --all-targets

  linux-portability:
    name: Linux portability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets

  verify:
    name: Verify
    if: always()
    needs: [windows, msrv, linux-portability]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Enforce verification results
        env:
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          LINUX_RESULT: ${{ needs.linux-portability.result }}
        run: |
          set -euo pipefail
          test "$WINDOWS_RESULT" = "success"
          test "$MSRV_RESULT" = "success"
          test "$LINUX_RESULT" = "success"
