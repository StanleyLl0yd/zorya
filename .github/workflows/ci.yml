name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows primary
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Build developer executable
        run: cargo build --locked --bin zorya
      - name: Smoke test developer executable
        run: .\\target\\debug\\zorya.exe --version
      - name: Smoke test native shell
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\\target\\debug\\zorya.exe" -ArgumentList "--native-smoke" -PassThru -NoNewWindow
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw "native shell smoke test timed out"
          }
          if ($process.ExitCode -ne 0) {
            throw "native shell smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Smoke test presentation-safe tab activation
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\\target\\debug\\zorya.exe" -ArgumentList "--native-tab-activation-smoke" -PassThru -NoNewWindow
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw "native tab activation smoke test timed out"
          }
          if ($process.ExitCode -ne 0) {
            throw "native tab activation smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Smoke test presentation-safe tab close
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\\target\\debug\\zorya.exe" -ArgumentList "--native-tab-close-smoke" -PassThru -NoNewWindow
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw "native tab close smoke test timed out"
          }
          if ($process.ExitCode -ne 0) {
            throw "native tab close smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Smoke test rapid tab activation supersession
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\\target\\debug\\zorya.exe" -ArgumentList "--native-tab-supersession-smoke" -PassThru -NoNewWindow
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw "native tab supersession smoke test timed out"
          }
          if ($process.ExitCode -ne 0) {
            throw "native tab supersession smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Upload developer executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zorya-windows-dev-${{ github.sha }}
          path: target/debug/zorya.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up MSRV
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
      - name: Check MSRV
        run: cargo check --locked --all-targets

  linux-portability:
    name: Linux portability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets

  verify:
    name: Verify
    if: always()
    needs: [windows, msrv, linux-portability]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Enforce verification results
        env:
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          LINUX_RESULT: ${{ needs.linux-portability.result }}
        run: |
          set -euo pipefail
          test "$WINDOWS_RESULT" = "success"
          test "$MSRV_RESULT" = "success"
          test "$LINUX_RESULT" = "success"
