name: Z4 Network authorization envelope validation

on:
  push:
    branches: [z4/network-authorization-envelope]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Exact base diff check
        run: git diff --check 83b5b1bd5eacc64a3256b859c81df8d3b1355ab4..HEAD
      - name: Enforce authorization envelope boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 83b5b1bd5eacc64a3256b859c81df8d3b1355ab4..HEAD -- Cargo.toml Cargo.lock
          grep -q 'target: WebUrl' src/engine.rs
          grep -q 'max_response_body_bytes: usize' src/engine.rs
          grep -q 'authorize_consumed_network_target(host, &stored)' src/privileged_request.rs
          grep -q 'request.body_storage()' src/network_target_policy.rs
          ! grep -q 'start_navigation_context_network_operation' src/privileged_request.rs
          ! grep -q 'start_navigation_context_network_operation' src/network_target_policy.rs
          ! grep -q 'NavigationContextId::try_new' src/network_target_policy.rs
