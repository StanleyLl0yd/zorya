name: Z3 117 publish verified production code

on:
  push:
    branches: [z3/session-restore-native-persistence]
    paths:
      - .github/workflows/z3-117-session-native-v3.yml
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Rustfmt
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Recreate verified production state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 91a8e068577bd71443dc391a0c6952b3f365117e)" = "91a8e068577bd71443dc391a0c6952b3f365117e"
          python3 scripts/z3_117_driver.py
          cargo fmt --all
          cargo fmt --all -- --check
          test "$(git rev-parse 91a8e068577bd71443dc391a0c6952b3f365117e:Cargo.toml)" = "$(git hash-object Cargo.toml)"
          test "$(git rev-parse 91a8e068577bd71443dc391a0c6952b3f365117e:Cargo.lock)" = "$(git hash-object Cargo.lock)"
          grep -F 'rev = "331689e7dff02a556d0b96530178def821056e20"' Cargo.toml
          if git grep -n -F 'ControlFlow::Poll' -- src; then exit 1; fi
          git diff --check 91a8e068577bd71443dc391a0c6952b3f365117e
      - name: Commit source and documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ARCHITECTURE.md docs/ROADMAP.md src/lib.rs src/main.rs src/platform/mod.rs src/platform/windows.rs src/profile_session_restore_scheduler.rs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Z3: integrate session restore save scheduler into native lifecycle'
            git push
          fi
