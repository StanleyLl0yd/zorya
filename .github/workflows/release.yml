name: Publish Technical Preview

on:
  push:
    branches:
      - "release-publish/v*"

permissions: {}

concurrency:
  group: zorya-release-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Windows Technical Preview
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      ZORYA_BUILD_COMMIT: ${{ github.sha }}
      ZORYA_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Validate publication ref and main gates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseMatch = [regex]::Match(
            $env:GITHUB_REF_NAME,
            '^release-publish/v(?<version>[0-9]+[.][0-9]+[.][0-9]+(?:[-+][0-9A-Za-z.-]+)?)$'
          )
          if (-not $releaseMatch.Success) {
            throw "invalid release publication ref: $env:GITHUB_REF_NAME"
          }

          $version = $releaseMatch.Groups["version"].Value
          $tag = "v$version"

          git fetch origin main --depth=1
          if ($LASTEXITCODE -ne 0) {
            throw "failed to fetch origin/main"
          }

          $headSha = (git rev-parse HEAD | Out-String).Trim().ToLowerInvariant()
          $mainSha = (git rev-parse origin/main | Out-String).Trim().ToLowerInvariant()
          if ($headSha -ne $mainSha) {
            throw "release publication ref must point exactly at current origin/main"
          }

          $metadata = cargo metadata --locked --format-version 1 --no-deps | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "cargo metadata failed with exit code $LASTEXITCODE"
          }
          $packages = @(
            $metadata.packages | Where-Object {
              $_.name -eq "zorya" -and $null -eq $_.source
            }
          )
          if ($packages.Count -ne 1) {
            throw "expected exactly one workspace zorya package; found $($packages.Count)"
          }
          if ([string]$packages[0].version -ne $version) {
            throw "publication ref version $version does not match Cargo version $($packages[0].version)"
          }

          $notes = "docs/releases/$version.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "release notes are missing: $notes"
          }

          foreach ($workflow in @("ci.yml", "release-candidate.yml", "security.yml", "codeql.yml")) {
            $runs = gh api -H "Accept: application/vnd.github+json" "/repos/$env:GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&status=success&per_page=100" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) {
              throw "failed to inspect $workflow workflow history"
            }
            $match = @(
              $runs.workflow_runs | Where-Object {
                ([string]$_.head_sha).ToLowerInvariant() -eq $mainSha -and $_.conclusion -eq "success"
              }
            )
            if ($match.Count -eq 0) {
              throw "no successful $workflow run exists for main commit $mainSha"
            }
          }

          $existingTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "failed to query existing release tags"
          }
          if ($existingTag) {
            throw "release tag already exists: $tag"
          }

          $releases = gh api -H "Accept: application/vnd.github+json" "/repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "failed to query existing GitHub Releases"
          }
          $existingRelease = @(
            $releases | Where-Object { [string]$_.tag_name -eq $tag }
          )
          if ($existingRelease.Count -ne 0) {
            throw "GitHub Release already exists: $tag"
          }

          "ZORYA_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "ZORYA_RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "ZORYA_RELEASE_NOTES=$notes" >> $env:GITHUB_ENV

      - name: Validate packaging script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $path = (Resolve-Path ".github/scripts/package-release.ps1").Path
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object {
              Write-Error ("line {0}, column {1}: {2} :: {3}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message, $_.Extent.Text)
            }
            throw "release packaging script contains PowerShell parse errors"
          }

      - name: Fetch locked dependencies
        run: cargo fetch --locked --target x86_64-pc-windows-msvc

      - name: Preflight release licenses
        shell: pwsh
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          & ".github/scripts/package-release.ps1" -Version $env:ZORYA_RELEASE_VERSION -CommitSha $env:ZORYA_BUILD_COMMIT -SourceCommitSha $env:ZORYA_SOURCE_COMMIT -LicensePreflight

      - name: Build release executable
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo build --locked --release --bin zorya

      - name: Verify release executable version
        shell: pwsh
        run: |
          $executable = Join-Path "target/release" "zorya.exe"
          $actual = (& $executable --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "release executable version check failed with exit code $LASTEXITCODE"
          }
          $expected = "Zorya $env:ZORYA_RELEASE_VERSION"
          if ($actual -ne $expected) {
            throw "release executable reports '$actual'; expected '$expected'"
          }

      - name: Smoke test release native shell
        shell: pwsh
        run: |
          $executable = Join-Path "target/release" "zorya.exe"
          $process = Start-Process -FilePath $executable -ArgumentList "--native-smoke" -PassThru -NoNewWindow
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw "release native shell smoke test timed out"
          }
          if ($process.ExitCode -ne 0) {
            throw "release native shell smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Package Technical Preview
        shell: pwsh
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          & ".github/scripts/package-release.ps1" -Version $env:ZORYA_RELEASE_VERSION -CommitSha $env:ZORYA_BUILD_COMMIT -SourceCommitSha $env:ZORYA_SOURCE_COMMIT

      - name: Verify packaged release
        shell: pwsh
        run: |
          $packageName = "zorya-$env:ZORYA_RELEASE_VERSION-windows-x86_64"
          $archive = Join-Path "dist" "$packageName.zip"
          $hashFile = "$archive.sha256"

          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "release archive was not created"
          }
          if (-not (Test-Path -LiteralPath $hashFile -PathType Leaf)) {
            throw "release SHA-256 file was not created"
          }

          $expectedHash = ((Get-Content -LiteralPath $hashFile -Raw).Trim() -split ' +')[0]
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expectedHash -ne $actualHash) {
            throw "release archive SHA-256 mismatch"
          }

          $verifyRoot = Join-Path $env:RUNNER_TEMP "zorya-release-publish-verify"
          if (Test-Path -LiteralPath $verifyRoot) {
            Remove-Item -LiteralPath $verifyRoot -Recurse -Force
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $verifyRoot

          $packageRoot = Join-Path $verifyRoot $packageName
          $packagedExecutable = Join-Path $packageRoot "zorya.exe"
          $actualVersion = (& $packagedExecutable --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "packaged executable version check failed with exit code $LASTEXITCODE"
          }
          if ($actualVersion -ne "Zorya $env:ZORYA_RELEASE_VERSION") {
            throw "packaged executable reports unexpected version '$actualVersion'"
          }

          $process = Start-Process -FilePath $packagedExecutable -ArgumentList "--native-smoke" -PassThru -NoNewWindow
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw "packaged native shell smoke test timed out"
          }
          if ($process.ExitCode -ne 0) {
            throw "packaged native shell smoke test failed with exit code $($process.ExitCode)"
          }

          $buildInfoPath = Join-Path $packageRoot "BUILD-INFO.txt"
          if (-not (Test-Path -LiteralPath $buildInfoPath -PathType Leaf)) {
            throw "packaged build provenance is missing"
          }
          $buildInfo = Get-Content -LiteralPath $buildInfoPath -Raw
          foreach ($required in @(
            "Zorya version: $env:ZORYA_RELEASE_VERSION",
            "Build checkout commit: $env:ZORYA_BUILD_COMMIT",
            "Source head commit: $env:ZORYA_SOURCE_COMMIT",
            "Target: x86_64-pc-windows-msvc",
            "Build profile: release"
          )) {
            if ($buildInfo -notmatch [regex]::Escape($required)) {
              throw "packaged build provenance is missing '$required'"
            }
          }

          $licenseRoot = Join-Path $packageRoot "THIRD_PARTY_LICENSES"
          $licenseIndex = Join-Path $licenseRoot "README.md"
          if (-not (Test-Path -LiteralPath $licenseIndex -PathType Leaf)) {
            throw "packaged third-party license index is missing"
          }
          $licenseInventory = Join-Path $licenseRoot "INVENTORY.tsv"
          if (-not (Test-Path -LiteralPath $licenseInventory -PathType Leaf)) {
            throw "packaged canonical third-party license inventory is missing"
          }

      - name: Retain publication artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zorya-publish-${{ github.sha }}
          path: |
            dist/zorya-${{ env.ZORYA_RELEASE_VERSION }}-windows-x86_64.zip
            dist/zorya-${{ env.ZORYA_RELEASE_VERSION }}-windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  attest:
    name: Attest Windows Technical Preview
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified publication artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: zorya-publish-${{ github.sha }}
          path: dist

      - name: Verify downloaded archive hash
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find dist -maxdepth 1 -type f -name 'zorya-*-windows-x86_64.zip' -print -quit)"
          checksum="${archive}.sha256"
          test -n "$archive"
          test -f "$checksum"
          (cd dist && sha256sum --check "$(basename "$checksum")")

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/zorya-*-windows-x86_64.zip
            dist/zorya-*-windows-x86_64.zip.sha256

  publish:
    name: Publish Windows Technical Preview
    needs: [build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download attested publication artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: zorya-publish-${{ github.sha }}
          path: dist

      - name: Verify artifact integrity and attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$(find dist -maxdepth 1 -type f -name 'zorya-*-windows-x86_64.zip' -print -quit)"
          checksum="${archive}.sha256"
          test -n "$archive"
          test -f "$checksum"
          (cd dist && sha256sum --check "$(basename "$checksum")")
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$checksum" --repo "$GITHUB_REPOSITORY"

      - name: Revalidate release target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^release-publish/v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          version="${GITHUB_REF_NAME#release-publish/v}"
          tag="v$version"
          notes="docs/releases/$version.md"
          test -f "$notes"
          git fetch origin main --depth=1
          head_sha="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          main_sha="$(git rev-parse origin/main | tr '[:upper:]' '[:lower:]')"
          test "$head_sha" = "$main_sha"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "release tag already exists: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $tag" >&2
            exit 1
          fi
          echo "ZORYA_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "ZORYA_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "ZORYA_RELEASE_NOTES=$notes" >> "$GITHUB_ENV"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_name="zorya-$ZORYA_RELEASE_VERSION-windows-x86_64"
          archive="dist/$package_name.zip"
          checksum="$archive.sha256"
          title="Zorya $ZORYA_RELEASE_VERSION Technical Preview"
          test -f "$archive"
          test -f "$checksum"
          gh release create "$ZORYA_RELEASE_TAG" "$archive" "$checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file "$ZORYA_RELEASE_NOTES" \
            --prerelease
          release_json="$(gh release view "$ZORYA_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets)"
          test "$(jq -r '.tagName' <<< "$release_json")" = "$ZORYA_RELEASE_TAG"
          test "$(jq -r '.isDraft' <<< "$release_json")" = "false"
          test "$(jq -r '.isPrerelease' <<< "$release_json")" = "true"
          jq -e --arg zip "$package_name.zip" --arg sum "$package_name.zip.sha256" '
            [.assets[].name] as $names |
            ($names | index($zip)) != null and ($names | index($sum)) != null
          ' <<< "$release_json" >/dev/null
