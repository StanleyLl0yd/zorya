name: Z3 117 stage verified workflow blobs

on:
  push:
    branches: [z3/session-restore-native-persistence]
    paths:
      - .github/workflows/z3-117-session-native-v4.yml
  workflow_dispatch:

permissions: {}

jobs:
  stage-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Regenerate exact verified workflow files from base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/z3-117-workflow-base
          git worktree add --detach /tmp/z3-117-workflow-base 91a8e068577bd71443dc391a0c6952b3f365117e
          mkdir -p /tmp/z3-117-workflow-base/scripts
          cp scripts/z3_117_session_native.py scripts/z3_117_driver.py /tmp/z3-117-workflow-base/scripts/
          (
            cd /tmp/z3-117-workflow-base
            python3 scripts/z3_117_driver.py
          )
          cp /tmp/z3-117-workflow-base/.github/workflows/ci.yml scripts/z3_117_ci_snapshot.yml.txt
          cp /tmp/z3-117-workflow-base/.github/workflows/release-candidate.yml scripts/z3_117_release_candidate_snapshot.yml.txt
          git worktree remove --force /tmp/z3-117-workflow-base
          grep -F -- '--native-session-restore-persistence-smoke' scripts/z3_117_ci_snapshot.yml.txt
          test "$(grep -F -c -- '--native-session-restore-persistence-smoke' scripts/z3_117_release_candidate_snapshot.yml.txt)" -eq 2
      - name: Commit workflow blob snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/z3_117_ci_snapshot.yml.txt scripts/z3_117_release_candidate_snapshot.yml.txt
          git diff --cached --check
          git commit -m 'chore: stage verified Z3 #117 workflow blobs'
          git push
