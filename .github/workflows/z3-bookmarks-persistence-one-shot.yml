name: Z3 bookmarks persistence one-shot

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.event.pull_request.head.ref == 'z3/bookmarks-persistence-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Wire bookmarks persistence lifecycle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/profile_runtime.rs",
              'use std::fmt;\nuse std::path::{Path, PathBuf};\n',
              'use std::fmt;\nuse std::path::{Path, PathBuf};\n\nmod bookmarks_persistence;\n\nuse bookmarks_persistence::BookmarksRuntimeState;\npub use bookmarks_persistence::{\n    ProfileBookmarksRuntimeError, ProfileBookmarksSaveCompletion, ProfileBookmarksSaveId,\n    ProfileBookmarksSaveIntent,\n};\n',
          )
          replace_once(
              "src/profile_runtime.rs",
              '    bookmarks: BookmarksSnapshot,\n    bookmarks_recovery: Option<BookmarksRecovery>,\n    settings_revision: u64,\n',
              '    bookmarks: BookmarksRuntimeState,\n    settings_revision: u64,\n',
          )
          replace_once(
              "src/profile_runtime.rs",
              '    pub const fn bookmarks(&self) -> &BookmarksSnapshot {\n        &self.bookmarks\n    }\n\n    pub const fn bookmarks_recovery(&self) -> Option<&BookmarksRecovery> {\n        self.bookmarks_recovery.as_ref()\n    }\n}\n\n#[derive(Clone, Copy, Debug, PartialEq, Eq, PartialOrd, Ord, Hash)]\npub struct ProfileSettingsSaveId(u64);\n',
              '    pub const fn bookmarks(&self) -> &BookmarksSnapshot {\n        self.bookmarks.snapshot()\n    }\n\n    pub const fn bookmarks_recovery(&self) -> Option<&BookmarksRecovery> {\n        self.bookmarks.recovery()\n    }\n}\n\n#[derive(Clone, Copy, Debug, PartialEq, Eq, PartialOrd, Ord, Hash)]\npub struct ProfileSettingsSaveId(u64);\n',
          )
          replace_once(
              "src/profile_runtime.rs",
              '            if persistence_pending || persistence_dirty {\n',
              '            if persistence_pending || persistence_dirty || !active.bookmarks.is_durable() {\n',
          )
          replace_once(
              "src/profile_runtime.rs",
              '            bookmarks: prepared.bookmarks,\n            bookmarks_recovery: prepared.bookmarks_recovery,\n            settings_revision: 0,\n',
              '            bookmarks: BookmarksRuntimeState::new(\n                prepared.bookmarks,\n                prepared.bookmarks_recovery,\n            ),\n            settings_revision: 0,\n',
          )

          replace_once(
              "src/bookmarks.rs",
              '    pub fn clear(&mut self) {\n        self.bookmarks.clear();\n    }\n}\n\n#[derive(Clone, Debug, PartialEq, Eq)]\npub struct BookmarksRecovery {\n',
              '    pub fn clear(&mut self) {\n        self.bookmarks.clear();\n    }\n\n    pub(crate) fn advance_generation_after_save(\n        &mut self,\n        expected_generation: u64,\n        saved_generation: u64,\n    ) -> bool {\n        if self.generation != expected_generation || saved_generation <= expected_generation {\n            return false;\n        }\n        self.generation = saved_generation;\n        true\n    }\n}\n\n#[derive(Clone, Debug, PartialEq, Eq)]\npub struct BookmarksRecovery {\n',
          )

          replace_once(
              "src/profile_worker.rs",
              'use crate::profile_runtime::{\n    PreparedProfile, ProfileHistorySaveCompletion, ProfileHistorySaveIntent,\n    ProfilePreparationError, ProfileSelectionId, ProfileSelectionIntent,\n    ProfileSettingsSaveCompletion, ProfileSettingsSaveIntent,\n};\n',
              'use crate::profile_runtime::{\n    PreparedProfile, ProfileBookmarksSaveCompletion, ProfileBookmarksSaveIntent,\n    ProfileHistorySaveCompletion, ProfileHistorySaveIntent, ProfilePreparationError,\n    ProfileSelectionId, ProfileSelectionIntent, ProfileSettingsSaveCompletion,\n    ProfileSettingsSaveIntent,\n};\n',
          )
          replace_once(
              "src/profile_worker.rs",
              '    SaveSettings(ProfileSettingsSaveIntent),\n    SaveHistory(ProfileHistorySaveIntent),\n    DiscoverCatalog(ProfileCatalogDiscoverIntent),\n',
              '    SaveSettings(ProfileSettingsSaveIntent),\n    SaveHistory(ProfileHistorySaveIntent),\n    SaveBookmarks(ProfileBookmarksSaveIntent),\n    DiscoverCatalog(ProfileCatalogDiscoverIntent),\n',
          )
          replace_once(
              "src/profile_worker.rs",
              '    SettingsSaved(ProfileSettingsSaveCompletion),\n    HistorySaved(ProfileHistorySaveCompletion),\n    CatalogDiscovered {\n',
              '    SettingsSaved(ProfileSettingsSaveCompletion),\n    HistorySaved(ProfileHistorySaveCompletion),\n    BookmarksSaved(ProfileBookmarksSaveCompletion),\n    CatalogDiscovered {\n',
          )
          replace_once(
              "src/profile_worker.rs",
              '    pub fn discover_profiles(\n',
              '''    pub fn save_bookmarks(\n        &self,\n        intent: ProfileBookmarksSaveIntent,\n    ) -> Result<(), ProfileWorkerSubmitError<ProfileBookmarksSaveIntent>> {\n        match self\n            .sender\n            .try_send(ProfileWorkerCommand::SaveBookmarks(intent))\n        {\n            Ok(()) => Ok(()),\n            Err(TrySendError::Full(ProfileWorkerCommand::SaveBookmarks(intent))) => {\n                Err(ProfileWorkerSubmitError::Full(Box::new(intent)))\n            }\n            Err(TrySendError::Disconnected(ProfileWorkerCommand::SaveBookmarks(intent))) => {\n                Err(ProfileWorkerSubmitError::Unavailable(Box::new(intent)))\n            }\n            Err(TrySendError::Full(_)) | Err(TrySendError::Disconnected(_)) => {\n                unreachable!("bookmarks-save submission preserves its command variant")\n            }\n        }\n    }\n\n    pub fn discover_profiles(\n''',
          )
          replace_once(
              "src/profile_worker.rs",
              '            ProfileWorkerCommand::SaveHistory(intent) => {\n                ProfileWorkerCompletion::HistorySaved(intent.execute())\n            }\n            ProfileWorkerCommand::DiscoverCatalog(intent) => {\n',
              '            ProfileWorkerCommand::SaveHistory(intent) => {\n                ProfileWorkerCompletion::HistorySaved(intent.execute())\n            }\n            ProfileWorkerCommand::SaveBookmarks(intent) => {\n                ProfileWorkerCompletion::BookmarksSaved(intent.execute())\n            }\n            ProfileWorkerCommand::DiscoverCatalog(intent) => {\n',
          )
          replace_once(
              "src/profile_worker.rs",
              '    #[test]\n    fn bounded_queue_returns_full_work_without_blocking_or_losing_identity() {\n',
              '''    #[test]\n    fn bookmarks_save_executes_on_worker_and_reconciles_runtime() {\n        let root = TempRoot::new("bookmarks-save");\n        let mut runtime = ProfileRuntime::new();\n        let selection = runtime.begin_selection(root.path()).unwrap().into_intent();\n        let prepared = PreparedProfile::load(&selection).unwrap();\n        let profile = runtime.commit_selection(prepared).unwrap().active_profile();\n        runtime\n            .add_bookmark(profile, "Example", "https://example.test/")\n            .unwrap();\n        let intent = runtime\n            .begin_bookmarks_save_if_dirty(profile)\n            .unwrap()\n            .unwrap();\n        let save = intent.id();\n        let (worker, receiver) = worker_channel();\n\n        worker.save_bookmarks(intent).unwrap();\n        let (thread_name, completion) = receive(&receiver);\n        assert_eq!(thread_name, "zorya-profile");\n        let ProfileWorkerCompletion::BookmarksSaved(completion) = completion else {\n            panic!("expected bookmarks-save completion");\n        };\n        assert_eq!(completion.id(), save);\n        assert!(completion.result().is_ok());\n        runtime.complete_bookmarks_save(completion).unwrap();\n        assert!(!runtime.bookmarks_is_dirty(profile).unwrap());\n        assert_eq!(runtime.active_bookmarks(profile).unwrap().generation(), 1);\n    }\n\n    #[test]\n    fn bounded_queue_returns_full_work_without_blocking_or_losing_identity() {\n''',
          )

          replace_once(
              "src/lib.rs",
              '    ActiveProfile, ColorSchemePreference, PreparedProfile, ProductSettings,\n    ProfileHistorySaveCompletion, ProfileHistorySaveId, ProfileHistorySaveIntent, ProfileId,\n',
              '    ActiveProfile, ColorSchemePreference, PreparedProfile, ProductSettings,\n    ProfileBookmarksRuntimeError, ProfileBookmarksSaveCompletion, ProfileBookmarksSaveId,\n    ProfileBookmarksSaveIntent, ProfileHistorySaveCompletion, ProfileHistorySaveId,\n    ProfileHistorySaveIntent, ProfileId,\n',
          )

          Path('.github/workflows/z3-bookmarks-persistence-one-shot.yml').unlink()
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          git diff --check
      - name: Commit wired lifecycle
        shell: bash
        run: |
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add src/profile_runtime.rs src/profile_runtime/bookmarks_persistence.rs src/bookmarks.rs src/profile_worker.rs src/lib.rs .github/workflows/z3-bookmarks-persistence-one-shot.yml
          git diff --cached --stat
          git commit -m "Z3: wire bookmarks persistence lifecycle"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
