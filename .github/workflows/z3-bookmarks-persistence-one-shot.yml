name: Z3 bookmarks persistence one-shot

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'z3/bookmarks-persistence-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Harden bookmark save identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_region(path, start, end, replacement):
              p = Path(path)
              text = p.read_text()
              if text.count(start) != 1:
                  raise SystemExit(f"{path}: start anchor count is {text.count(start)}")
              begin = text.index(start)
              finish = text.find(end, begin)
              if finish < 0:
                  raise SystemExit(f"{path}: end anchor not found")
              p.write_text(text[:begin] + replacement + text[finish:])

          runtime = 'src/profile_runtime.rs'
          replace_once(runtime,
              'use bookmarks_persistence::BookmarksRuntimeState;\n',
              'use bookmarks_persistence::{BookmarksRuntimeState, PendingProfileBookmarksSave};\n')
          replace_once(runtime,
              '    next_settings_save_id: u64,\n    next_history_save_id: u64,\n    active: Option<ActiveProfile>,\n',
              '    next_settings_save_id: u64,\n    next_history_save_id: u64,\n    next_bookmarks_save_id: u64,\n    active: Option<ActiveProfile>,\n')
          replace_once(runtime,
              '    pending_settings_save: Option<PendingProfileSettingsSave>,\n    pending_history_save: Option<PendingProfileHistorySave>,\n',
              '    pending_settings_save: Option<PendingProfileSettingsSave>,\n    pending_history_save: Option<PendingProfileHistorySave>,\n    pending_bookmarks_save: Option<PendingProfileBookmarksSave>,\n')
          replace_once(runtime,
              '            next_settings_save_id: 1,\n            next_history_save_id: 1,\n            active: None,\n',
              '            next_settings_save_id: 1,\n            next_history_save_id: 1,\n            next_bookmarks_save_id: 1,\n            active: None,\n')
          replace_once(runtime,
              '            pending_settings_save: None,\n            pending_history_save: None,\n',
              '            pending_settings_save: None,\n            pending_history_save: None,\n            pending_bookmarks_save: None,\n')
          replace_once(runtime,
              '            let persistence_pending =\n                self.pending_settings_save.is_some() || self.pending_history_save.is_some();\n            let persistence_dirty = active.settings_revision != active.durable_settings_revision\n                || active.browsing_history_revision != active.durable_browsing_history_revision;\n            if persistence_pending || persistence_dirty || !active.bookmarks.is_durable() {\n',
              '            let persistence_pending = self.pending_settings_save.is_some()\n                || self.pending_history_save.is_some()\n                || self.pending_bookmarks_save.is_some();\n            let persistence_dirty = active.settings_revision != active.durable_settings_revision\n                || active.browsing_history_revision != active.durable_browsing_history_revision\n                || active.bookmarks.is_dirty();\n            if persistence_pending || persistence_dirty {\n')

          bp = 'src/profile_runtime/bookmarks_persistence.rs'
          replace_once(bp,
              '#[derive(Clone, Copy, Debug, PartialEq, Eq)]\nstruct PendingBookmarksSave {\n    id: ProfileBookmarksSaveId,\n    base_generation: u64,\n    mutation_revision: u64,\n}\n',
              '#[derive(Clone, Copy, Debug, PartialEq, Eq)]\npub(super) struct PendingProfileBookmarksSave {\n    id: ProfileBookmarksSaveId,\n    profile: ProfileId,\n    base_generation: u64,\n    mutation_revision: u64,\n}\n')
          replace_once(bp,
              '    mutation_revision: u64,\n    durable_revision: u64,\n    next_save_id: u64,\n    pending_save: Option<PendingBookmarksSave>,\n',
              '    mutation_revision: u64,\n    durable_revision: u64,\n')
          replace_once(bp,
              '            mutation_revision: 0,\n            durable_revision: 0,\n            next_save_id: 1,\n            pending_save: None,\n',
              '            mutation_revision: 0,\n            durable_revision: 0,\n')
          replace_once(bp,
              '    pub(super) const fn is_durable(&self) -> bool {\n        self.pending_save.is_none() && self.mutation_revision == self.durable_revision\n    }\n',
              '    pub(super) const fn is_dirty(&self) -> bool {\n        self.mutation_revision != self.durable_revision\n    }\n')

          pending_method = '\n'.join([
              '    pub const fn pending_bookmarks_save(&self) -> Option<ProfileBookmarksSaveId> {',
              '        match self.pending_bookmarks_save {',
              '            Some(pending) => Some(pending.id),',
              '            None => None,',
              '        }',
              '    }',
              '',
          ])
          replace_region(bp, '    pub fn pending_bookmarks_save(', '    pub fn add_bookmark(', pending_method)

          begin_method = '\n'.join([
              '    pub fn begin_bookmarks_save(',
              '        &mut self,',
              '        profile: ProfileId,',
              '    ) -> Result<ProfileBookmarksSaveIntent, ProfileBookmarksRuntimeError> {',
              '        let expected = self.active.as_ref().map(ActiveProfile::id);',
              '        if expected != Some(profile) {',
              '            return Err(ProfileBookmarksRuntimeError::StaleProfile {',
              '                expected,',
              '                actual: profile,',
              '            });',
              '        }',
              '        if let Some(pending) = self.pending_bookmarks_save {',
              '            return Err(ProfileBookmarksRuntimeError::SaveAlreadyPending {',
              '                pending: pending.id,',
              '            });',
              '        }',
              '',
              '        let active = self.active.as_ref().expect("active profile was validated");',
              '        let root = active.root.clone();',
              '        let lock = active.lock.clone();',
              '        let snapshot = active.bookmarks.snapshot.clone();',
              '        let base_generation = snapshot.generation();',
              '        let mutation_revision = active.bookmarks.mutation_revision;',
              '        let id = ProfileBookmarksSaveId(self.next_bookmarks_save_id);',
              '        self.next_bookmarks_save_id = self',
              '            .next_bookmarks_save_id',
              '            .checked_add(1)',
              '            .ok_or(ProfileBookmarksRuntimeError::SaveIdExhausted)?;',
              '        self.pending_bookmarks_save = Some(PendingProfileBookmarksSave {',
              '            id,',
              '            profile,',
              '            base_generation,',
              '            mutation_revision,',
              '        });',
              '        Ok(ProfileBookmarksSaveIntent {',
              '            id,',
              '            profile,',
              '            root,',
              '            lock,',
              '            snapshot,',
              '            mutation_revision,',
              '        })',
              '    }',
              '',
          ])
          replace_region(bp, '    pub fn begin_bookmarks_save(', '    pub fn cancel_bookmarks_save(', begin_method)

          cancel_method = '\n'.join([
              '    pub fn cancel_bookmarks_save(',
              '        &mut self,',
              '        save: ProfileBookmarksSaveId,',
              '    ) -> Result<(), ProfileBookmarksRuntimeError> {',
              '        let expected = self.pending_bookmarks_save.map(|pending| pending.id);',
              '        if expected != Some(save) {',
              '            return Err(ProfileBookmarksRuntimeError::StaleSave {',
              '                expected,',
              '                actual: save,',
              '            });',
              '        }',
              '        self.pending_bookmarks_save = None;',
              '        Ok(())',
              '    }',
              '',
          ])
          replace_region(bp, '    pub fn cancel_bookmarks_save(', '    pub fn complete_bookmarks_save(', cancel_method)

          complete_method = '\n'.join([
              '    pub fn complete_bookmarks_save(',
              '        &mut self,',
              '        completion: ProfileBookmarksSaveCompletion,',
              '    ) -> Result<ProfileBookmarksSaveCompletion, ProfileBookmarksRuntimeError> {',
              '        let expected = self.pending_bookmarks_save.map(|pending| pending.id);',
              '        if expected != Some(completion.id) {',
              '            return Err(ProfileBookmarksRuntimeError::StaleSave {',
              '                expected,',
              '                actual: completion.id,',
              '            });',
              '        }',
              '',
              '        let pending = self',
              '            .pending_bookmarks_save',
              '            .expect("pending bookmarks save was validated");',
              '        let active = self',
              '            .active',
              '            .as_ref()',
              '            .ok_or(ProfileBookmarksRuntimeError::SaveTargetMismatch {',
              '                save: completion.id,',
              '            })?;',
              '        if pending.profile != completion.profile',
              '            || pending.base_generation != completion.base_generation',
              '            || pending.mutation_revision != completion.mutation_revision',
              '            || active.id != completion.profile',
              '            || active.root != completion.root',
              '        {',
              '            return Err(ProfileBookmarksRuntimeError::SaveTargetMismatch {',
              '                save: completion.id,',
              '            });',
              '        }',
              '',
              '        self.pending_bookmarks_save = None;',
              '        if let Ok(saved) = &completion.result {',
              '            let active = self',
              '                .active',
              '                .as_mut()',
              '                .expect("bookmarks save target was validated");',
              '            let current_generation = active.bookmarks.snapshot.generation();',
              '            let saved_generation = saved.snapshot().generation();',
              '            if !active',
              '                .bookmarks',
              '                .snapshot',
              '                .advance_generation_after_save(pending.base_generation, saved_generation)',
              '            {',
              '                return Err(ProfileBookmarksRuntimeError::SaveGenerationMismatch {',
              '                    expected_generation: pending.base_generation,',
              '                    current_generation,',
              '                    saved_generation,',
              '                });',
              '            }',
              '            active.bookmarks.durable_revision = pending.mutation_revision;',
              '        }',
              '        Ok(completion)',
              '    }',
              '',
          ])
          replace_region(bp, '    pub fn complete_bookmarks_save(', '}\n\n#[cfg(test)]', complete_method)
          replace_once(bp,
              '        runtime.active.as_mut().unwrap().bookmarks.next_save_id = u64::MAX;\n',
              '        runtime.next_bookmarks_save_id = u64::MAX;\n')

          for workflow in [
              '.github/workflows/z3-bookmarks-persistence-one-shot.yml',
              '.github/workflows/z3-bookmarks-save-id-one-shot.yml',
          ]:
              p = Path(workflow)
              if p.exists():
                  p.unlink()
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          git diff --check
      - name: Commit hardened lifecycle
        shell: bash
        run: |
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add src/profile_runtime.rs src/profile_runtime/bookmarks_persistence.rs .github/workflows/z3-bookmarks-persistence-one-shot.yml .github/workflows/z3-bookmarks-save-id-one-shot.yml
          git diff --cached --stat
          git commit -m "refactor: make bookmark save ids process-monotonic"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
