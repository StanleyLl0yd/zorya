name: Z4 Network context capability validation

on:
  push:
    branches:
      - z4/network-context-capability

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Diff check
        run: git diff --check c503320060fffb5e6291f70f4bc47f90f038d82e..HEAD
      - name: Capability boundary checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'pub fn authorize_network_once' src/privileged_request.rs
          grep -q 'pub struct EngineNetworkAuthorization' src/engine.rs
          grep -q 'grant_navigation_context_network_capability' src/engine.rs
          grep -q 'pub fn revoke_network_authorization' src/engine.rs
          ! grep -q 'NavigationContextId::try_new' src/engine.rs src/engine_authority.rs src/network_target_policy.rs src/privileged_request.rs
          ! grep -q 'start_navigation_context_network_operation' src/network_target_policy.rs src/privileged_request.rs
          git diff --quiet c503320060fffb5e6291f70f4bc47f90f038d82e..HEAD -- Cargo.toml Cargo.lock
          python3 - <<'PY'
          from pathlib import Path
          engine = Path("src/engine.rs").read_text()
          privileged = Path("src/privileged_request.rs").read_text()
          start = engine.index("pub struct EngineNetworkAuthorization")
          prefix = engine[max(0, start - 160):start]
          assert "#[derive(Clone" not in prefix
          method = privileged.index("pub(crate) fn preflight_network_once")
          prefix = privileged[max(0, method - 80):method]
          assert "#[cfg(test)]" in prefix
          assert "pub fn preflight_network_once" not in privileged
          PY
