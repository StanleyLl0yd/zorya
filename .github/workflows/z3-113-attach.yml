name: Z3 113 attachment staging

on:
  push:
    branches: [z3/session-restore-profile-attachment]
    paths:
      - scripts/z3_113_attach.py
      - scripts/z3_113_worker_box.py
      - .github/workflows/z3-113-attach.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: z3-113-attachment-staging
  cancel-in-progress: true

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply attachment
        run: |
          python3 scripts/z3_113_attach.py
          python3 scripts/z3_113_worker_box.py
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Verify invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse b6206406cc92ec419ee3ec664f8823500fe66cd9:Cargo.toml)" = "$(git hash-object Cargo.toml)"
          test "$(git rev-parse b6206406cc92ec419ee3ec664f8823500fe66cd9:Cargo.lock)" = "$(git hash-object Cargo.lock)"
          grep -F 'rev = "331689e7dff02a556d0b96530178def821056e20"' Cargo.toml
          if git grep -n -F 'ControlFlow::Poll' -- src; then
            echo 'ControlFlow::Poll is forbidden' >&2
            exit 1
          fi
          git diff --check
      - name: Commit verified production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/profile_runtime.rs src/profile_worker.rs src/platform/windows.rs tests/session_restore_profile_attachment.rs docs/ARCHITECTURE.md docs/ROADMAP.md
          git diff --cached --exit-code && { echo 'no production changes generated' >&2; exit 1; } || true
          git commit -m 'Z3: attach session restore to profile runtime'
          git push
