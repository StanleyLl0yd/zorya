name: Z4 Clipboard permission validation

on:
  push:
    branches: [z4/clipboard-permission-handoff]

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Diff check
        run: git diff --check 182d0cce58e1c76c57841833044867f59e878bf4..HEAD
      - name: Enforce Clipboard permission boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'pub fn request_clipboard_permission_once' src/privileged_request.rs
          ! grep -q 'pub fn preflight_clipboard_once' src/privileged_request.rs
          grep -q 'pub struct EngineClipboardPermissionRequest' src/privileged_request.rs
          grep -q 'PermissionRequired(EngineClipboardPermissionRequest)' src/privileged_request.rs
          grep -q 'pub fn deny(self)' src/privileged_request.rs
          ! grep -q 'grant_navigation_context_capability.*Clipboard' src/privileged_request.rs
          ! grep -q 'read_navigation_context_clipboard_text' src/privileged_request.rs
          ! grep -q 'write_navigation_context_clipboard_text' src/privileged_request.rs
          test "$(git rev-parse 182d0cce58e1c76c57841833044867f59e878bf4:Cargo.toml)" = "$(git rev-parse HEAD:Cargo.toml)"
          test "$(git rev-parse 182d0cce58e1c76c57841833044867f59e878bf4:Cargo.lock)" = "$(git rev-parse HEAD:Cargo.lock)"
          grep -q '331689e7dff02a556d0b96530178def821056e20' Cargo.toml
