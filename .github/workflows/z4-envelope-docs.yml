name: Z4 Network envelope docs sync

on:
  push:
    branches: [z4/network-request-envelope]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Synchronize Z4 envelope documentation
        shell: bash
        run: |
          if grep -q 'MAX_PRIVILEGED_NETWORK_DESTINATION_BYTES' docs/Z4_SECURITY_BOUNDARIES.md; then
            echo 'documentation already synchronized'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          def repl(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, got {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, expected))

          path = 'docs/ROADMAP.md'
          repl(
              path,
              'a bounded canonical pinned-Rarog `HeaderList`, and an exact optional request body.',
              'a bounded canonical pinned-Rarog `HeaderList`, an exact optional request body, and canonical pinned-Rarog `RequestMode`, `CredentialsMode`, `RedirectMode` and `RequestDestination` values.',
          )
          repl(
              path,
              'Body/header/target and aggregate body-memory bounds fail before request-ID allocation or pending-slot consumption, with checked arithmetic.',
              '`RequestDestination::Other(String)` is retained exactly but capped at 256 bytes before request-ID allocation, pending-slot use or body-budget consumption. Body/header/target/destination and aggregate body-memory bounds fail before request-ID allocation or pending-slot consumption, with checked arithmetic.',
          )
          repl(
              path,
              'Raw targets, source-Origin/host serialization, header names/values and body contents stay redacted from `Debug`; only the source authority plus safe aggregate sizes/presence and the canonical method may be shown.',
              'Raw targets, source-Origin/host serialization, header names/values, body contents and custom destination contents stay redacted from `Debug`; only the source authority, safe aggregate sizes/presence, canonical method, finite mode/credentials/redirect values and destination kind/byte count may be shown.',
          )
          repl(
              path,
              'same-ID source/kind/method/header/body/target mismatches and cross-kind burns cannot strand pending body budget.',
              'same-ID source/kind/method/header/body/mode/credentials/redirect/destination/target mismatches and cross-kind burns cannot strand pending body budget.',
          )
          repl(
              path,
              'and even a current exact same-site method/header/body/target-bound request remains `DeniedUnsupported`; request-mode/credentials/redirect/destination/response-limit binding, Origin-header synthesis, CORS/Fetch execution and all capability/Host operations remain future work;',
              'and even a current exact same-site fully envelope-bound request remains `DeniedUnsupported`; mode/credentials/redirect/destination binding is correlation only, while response-limit binding, Origin-header synthesis, CORS/Fetch execution and all capability/Host operations remain future work;',
          )

          path = 'docs/Z4_SECURITY_BOUNDARIES.md'
          repl(
              path,
              'Binding this source does not synthesize an HTTP `Origin` header and does not implement CORS, Fetch execution, credentials or redirect policy.',
              'Binding this source does not synthesize an HTTP `Origin` header and does not implement CORS or Fetch execution. Canonical mode/credentials/redirect/destination values retained by the one-shot request envelope are correlation state only and do not enact Fetch policy.',
          )
          repl(
              path,
              'The target policy does not synthesize an HTTP `Origin` header and does not implement CORS, Fetch execution, credentials, redirect or destination behavior; it must not be presented as doing so.',
              'The target policy does not synthesize an HTTP `Origin` header and does not implement CORS, Fetch execution or mode/credentials/redirect/destination behavior; retaining canonical values in the one-shot envelope must not be presented as enacting those semantics.',
          )
          repl(
              path,
              'Network attempts require and clone the Host-minted exact committed source (authority plus canonical Origin), binding that exact source to the raw requested target, a canonical pinned-Rarog `FetchMethod`, a bounded canonical pinned-Rarog `HeaderList`, and an exact optional bounded request body. The existing `register_network`, `register_network_with_headers`, `register_network_with_method`, and `register_network_with_method_and_headers` paths remain explicit no-body conveniences; `register_network_with_method_headers_and_body` is the full current method/header/body correlation path.',
              'Network attempts require and clone the Host-minted exact committed source (authority plus canonical Origin), binding that exact source to the raw requested target, a canonical pinned-Rarog `FetchMethod`, a bounded canonical pinned-Rarog `HeaderList`, an exact optional bounded request body, and canonical pinned-Rarog `RequestMode`, `CredentialsMode`, `RedirectMode` and `RequestDestination`. The existing `register_network`, `register_network_with_headers`, `register_network_with_method`, and `register_network_with_method_and_headers` paths remain explicit no-body conveniences; `register_network_with_method_headers_and_body` preserves the pinned Rarog Fetch defaults (`Cors`, `SameOrigin`, `Follow`, `Empty`), while `register_network_with_request_parts` binds the full current envelope without adding an unbound path.',
          )
          repl(
              path,
              'Header/body overflow, aggregate body-budget overflow and body-accounting arithmetic overflow fail closed before request-ID allocation or pending-slot consumption.',
              '`RequestDestination::Other(String)` is retained byte-for-byte but capped at 256 bytes (`MAX_PRIVILEGED_NETWORK_DESTINATION_BYTES`) before request-ID allocation, pending-slot use or body-budget consumption. Header/body/destination overflow, aggregate body-budget overflow and body-accounting arithmetic overflow fail closed before request-ID allocation or pending-slot consumption.',
          )
          repl(
              path,
              'Raw targets, canonical source-Origin/host/port serialization, header names/values and request-body contents are process-local, are not persisted, and are deliberately omitted from the Network handle\'s `Debug` output. Only target byte count, header count/aggregate header bytes, and body-present/body-byte metadata may be shown. The canonical HTTP method is non-secret correlation data and may appear in `Debug` output.',
              'Raw targets, canonical source-Origin/host/port serialization, header names/values, request-body contents and `RequestDestination::Other` contents are process-local, are not persisted, and are deliberately omitted from the Network handle\'s `Debug` output. Only target byte count, header count/aggregate header bytes, body-present/body-byte metadata, finite mode/credentials/redirect values, destination kind and custom-destination byte count may be shown. The canonical HTTP method is non-secret correlation data and may appear in `Debug` output.',
          )
          repl(
              path,
              'Binding a canonical method, headers and body does not execute the method, interpret header/body semantics beyond Rarog\'s method/body compatibility contract, or start a network operation.',
              'Binding a canonical method, headers, body, mode, credentials, redirect and destination does not execute the method, interpret header/body semantics beyond Rarog\'s method/body compatibility contract, enact Fetch mode/credential/redirect/destination behavior, or start a network operation.',
          )
          repl(
              path,
              'Same-ID source/kind/method/header/body/target mismatches burn the stored slot rather than making it reusable;',
              'Same-ID source/kind/method/header/body/mode/credentials/redirect/destination/target mismatches burn the stored slot rather than making it reusable;',
          )
          repl(
              path,
              'Exact method/header/body/target-bound Network requests invoke the canonical Network target preflight with the stored raw target.',
              'Exact fully envelope-bound Network requests invoke the canonical Network target preflight with the stored raw target.',
          )
          repl(
              path,
              'and swapping method, headers, body or target on a captured request cannot redirect its later operation/policy identity.',
              'and swapping method, headers, body, mode, credentials, redirect, destination or target on a captured request cannot redirect its later operation/policy identity.',
          )
          repl(
              path,
              'Even a current exact same-site method/header/body/target-bound Network request still ends at `DeniedUnsupported`.',
              'Even a current exact same-site fully envelope-bound Network request still ends at `DeniedUnsupported`.',
          )
          repl(
              path,
              'Request mode, credentials, redirect, destination and response-limit binding remain outside this slice; Origin-header synthesis, CORS enforcement and Fetch execution are also not introduced.',
              'Mode, credentials, redirect and destination are now bound only as canonical correlation metadata; response-limit binding remains outside this slice. Origin-header synthesis, CORS enforcement and Fetch execution are also not introduced.',
          )
          repl(
              path,
              '- Network request-mode/credentials/redirect/destination/response-limit binding;',
              '- Network response-limit binding and any execution/policy semantics for the bound request mode, credentials, redirect or destination;',
          )

          path = 'docs/ARCHITECTURE.md'
          anchor = 'For Network correlation, `EngineHost::committed_document_source` extends that exact authority snapshot with the canonical Rarog `Origin` of the live committed `View::document_url()`. Only present HTTP(S), non-opaque Origins can be minted, and the Origin\'s Rarog Site is cross-checked against the same live Host Site/process state before publication. The Origin is shared across clones, participates in exact one-shot Network request identity and is omitted from `Debug` serialization; Zorya does not independently parse or normalize Origin hosts/default ports. This binding is not authorization, does not synthesize an HTTP `Origin` header, and does not implement CORS or Fetch execution.\n'
          addition = anchor + '\n`EnginePrivilegedRequestTracker` extends that Network correlation identity with the exact raw target, canonical pinned-Rarog method and bounded headers, exact optional bounded body, and canonical pinned-Rarog request mode, credentials mode, redirect mode and destination. Compatibility registration binds Rarog\'s exact `Cors` / `SameOrigin` / `Follow` / `Empty` defaults; the full request-parts path accepts those canonical enums directly rather than parsing browser-owned strings. Custom `RequestDestination::Other` data is retained exactly but capped at 256 bytes before tracker slot/body-budget/identity consumption and is never serialized in `Debug`. All fields participate in one-shot equality, so same-ID substitution burns the request after centrally releasing body accounting. These fields remain correlation metadata only: even an exact current same-Site request is denied as unsupported, and no CORS/Fetch behavior, capability grant or Host network execution follows from their presence.\n'
          p = Path(path)
          text = p.read_text()
          if text.count(anchor) != 1:
              raise SystemExit(f'{path}: EngineHost Network source anchor changed: {text.count(anchor)}')
          p.write_text(text.replace(anchor, addition, 1))
          PY
          git diff --check
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add docs/ROADMAP.md docs/Z4_SECURITY_BOUNDARIES.md docs/ARCHITECTURE.md
          git diff --cached --check
          git commit -m "docs: bind canonical Network request envelope metadata"
          git push origin HEAD:z4/network-request-envelope
