name: Z4 response-limit wording fix

on:
  push:
    branches: [z4/network-response-limit-binding]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          ref: z4/network-response-limit-binding
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply wording fix
        shell: bash
        run: |
          python3 .github/z4_response_limit_wording_fix.py
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo test --locked
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Z4_SECURITY_BOUNDARIES.md
          git diff --cached --quiet && { echo 'no wording fix produced'; exit 1; }
          git commit -m "docs: clarify Network response-limit rejection"
          git push origin HEAD:z4/network-response-limit-binding
