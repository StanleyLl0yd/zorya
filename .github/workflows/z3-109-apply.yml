name: Z3 109 apply

on:
  push:
    branches: [z3/native-bookmark-toggle]
    paths: [.github/workflows/z3-109-apply.yml]
  workflow_dispatch:

permissions: {}

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout topic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: z3/native-bookmark-toggle
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def append_before_final_brace(path, block):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              pos = text.rfind("\n}")
              if pos < 0:
                  raise SystemExit(f"{path}: final brace anchor missing")
              p.write_text(text[:pos] + block + text[pos:], encoding="utf-8")

          replace_once(
              "src/bookmarks.rs",
              '''    pub fn remove_bookmark(&mut self, id: BookmarkId) -> Option<Bookmark> {
                  let index = self
                      .bookmarks
                      .iter()
                      .position(|bookmark| bookmark.id == id)?;
                  Some(self.bookmarks.remove(index))
              }

              pub fn clear(&mut self) {''',
              '''    pub fn remove_bookmark(&mut self, id: BookmarkId) -> Option<Bookmark> {
                  let index = self
                      .bookmarks
                      .iter()
                      .position(|bookmark| bookmark.id == id)?;
                  Some(self.bookmarks.remove(index))
              }

              pub(crate) fn remove_bookmarks_at_exact_location(&mut self, location: &str) -> usize {
                  let previous_len = self.bookmarks.len();
                  self.bookmarks.retain(|bookmark| bookmark.location != location);
                  previous_len - self.bookmarks.len()
              }

              pub fn clear(&mut self) {''')

          replace_once(
              "src/profile_runtime/bookmarks_persistence.rs",
              '''impl ProfileBookmarksSaveId {
                  pub const fn get(self) -> u64 {
                      self.0
                  }
              }

              #[derive(Debug, PartialEq, Eq)]''',
              '''impl ProfileBookmarksSaveId {
                  pub const fn get(self) -> u64 {
                      self.0
                  }
              }

              #[derive(Clone, Copy, Debug, PartialEq, Eq)]
              pub enum ProfileBookmarkToggleOutcome {
                  Added { bookmark: BookmarkId },
                  Removed { count: usize },
              }

              #[derive(Debug, PartialEq, Eq)]''')

          replace_once(
              "src/profile_runtime/bookmarks_persistence.rs",
              '''    pub const fn pending_bookmarks_save(&self) -> Option<ProfileBookmarksSaveId> {
                  match self.pending_bookmarks_save {
                      Some(pending) => Some(pending.id),
                      None => None,
                  }
              }
              pub fn add_bookmark(''',
              '''    pub const fn pending_bookmarks_save(&self) -> Option<ProfileBookmarksSaveId> {
                  match self.pending_bookmarks_save {
