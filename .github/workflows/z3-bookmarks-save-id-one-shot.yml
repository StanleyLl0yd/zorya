name: Z3 bookmarks save-id one-shot

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'z3/bookmarks-persistence-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Make bookmark save identity process-monotonic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/profile_runtime.rs',
              'use bookmarks_persistence::BookmarksRuntimeState;\n',
              'use bookmarks_persistence::{BookmarksRuntimeState, PendingProfileBookmarksSave};\n',
          )
          replace_once(
              'src/profile_runtime.rs',
              '    next_settings_save_id: u64,\n    next_history_save_id: u64,\n    active: Option<ActiveProfile>,\n',
              '    next_settings_save_id: u64,\n    next_history_save_id: u64,\n    next_bookmarks_save_id: u64,\n    active: Option<ActiveProfile>,\n',
          )
          replace_once(
              'src/profile_runtime.rs',
              '    pending_settings_save: Option<PendingProfileSettingsSave>,\n    pending_history_save: Option<PendingProfileHistorySave>,\n',
              '    pending_settings_save: Option<PendingProfileSettingsSave>,\n    pending_history_save: Option<PendingProfileHistorySave>,\n    pending_bookmarks_save: Option<PendingProfileBookmarksSave>,\n',
          )
          replace_once(
              'src/profile_runtime.rs',
              '            next_settings_save_id: 1,\n            next_history_save_id: 1,\n            active: None,\n',
              '            next_settings_save_id: 1,\n            next_history_save_id: 1,\n            next_bookmarks_save_id: 1,\n            active: None,\n',
          )
          replace_once(
              'src/profile_runtime.rs',
              '            pending_settings_save: None,\n            pending_history_save: None,\n',
              '            pending_settings_save: None,\n            pending_history_save: None,\n            pending_bookmarks_save: None,\n',
          )
          replace_once(
              'src/profile_runtime.rs',
              '''            let persistence_pending =
                self.pending_settings_save.is_some() || self.pending_history_save.is_some();
            let persistence_dirty = active.settings_revision != active.durable_settings_revision
                || active.browsing_history_revision != active.durable_browsing_history_revision;
            if persistence_pending || persistence_dirty || !active.bookmarks.is_durable() {
''',
              '''            let persistence_pending = self.pending_settings_save.is_some()
                || self.pending_history_save.is_some()
                || self.pending_bookmarks_save.is_some();
            let persistence_dirty = active.settings_revision != active.durable_settings_revision
                || active.browsing_history_revision != active.durable_browsing_history_revision
                || active.bookmarks.is_dirty();
            if persistence_pending || persistence_dirty {
''',
          )

          replace_once(
              'src/profile_runtime/bookmarks_persistence.rs',
              '''#[derive(Clone, Copy, Debug, PartialEq, Eq)]
struct PendingBookmarksSave {
    id: ProfileBookmarksSaveId,
    base_generation: u64,
    mutation_revision: u64,
}
''',
              '''#[derive(Clone, Copy, Debug, PartialEq, Eq)]
pub(super) struct PendingProfileBookmarksSave {
    id: ProfileBookmarksSaveId,
    profile: ProfileId,
    base_generation: u64,
    mutation_revision: u64,
}
''',
          )
          replace_once(
              'src/profile_runtime/bookmarks_persistence.rs',
              '''    mutation_revision: u64,
    durable_revision: u64,
    next_save_id: u64,
    pending_save: Option<PendingBookmarksSave>,
''',
              '''    mutation_revision: u64,
    durable_revision: u64,
''',
          )
          replace_once(
              'src/profile_runtime/bookmarks_persistence.rs',
              '''            mutation_revision: 0,
            durable_revision: 0,
            next_save_id: 1,
            pending_save: None,
''',
              '''            mutation_revision: 0,
            durable_revision: 0,
''',
          )
          replace_once(
              'src/profile_runtime/bookmarks_persistence.rs',
              '''    pub(super) const fn is_durable(&self) -> bool {
        self.pending_save.is_none() && self.mutation_revision == self.durable_revision
    }
''',
              '''    pub(super) const fn is_dirty(&self) -> bool {
        self.mutation_revision != self.durable_revision
    }
''',
          )
          replace_once(
              'src/profile_runtime/bookmarks_persistence.rs',
              '''    pub fn pending_bookmarks_save(&self) -> Option<ProfileBookmarksSaveId> {
        self.active
            .as_ref()
            .and_then(|active| active.bookmarks.pending_save.map(|pending| pending.id))
    }
''',
              '''    pub const fn pending_bookmarks_save(&self) -> Option<ProfileBookmarksSaveId> {
        match self.pending_bookmarks_save {
            Some(pending) => Some(pending.id),
            None => None,
        }
    }
''',
          )
          replace_once(
              'src/profile_runtime/bookmarks_persistence.rs',
              '''        let active = self.active.as_mut().expect("active profile was validated");
        if let Some(pending) = active.bookmarks.pending_save {
            return Err(ProfileBookmarksRuntimeError::SaveAlreadyPending {
                pending: pending.id,
            });
        }

        let id = ProfileBookmarksSaveId(active.bookmarks.next_save_id);
        let next_save_id = active
            .bookmarks
            .next_save_id
            .checked_add(1)
            .ok_or(ProfileBookmarksRuntimeError::SaveIdExhausted)?;
        let root = active.root.clone();
        let lock = active.lock.clone();
        let snapshot = active.bookmarks.snapshot.clone();
        let base_generation = snapshot.generation();
        let mutation_revision = active.bookmarks.mutation_revision;
        active.bookmarks.next_save_id = next_save_id;
        active.bookmarks.pending_save = Some(PendingBookmarksSave {
            id,
            base_generation,
            mutation_revision,
        });
''',
              '''        if let Some(pending) = self.pending_bookmarks_save {
            return Err(ProfileBookmarksRuntimeError::SaveAlreadyPending {
                pending: pending.id,
            });
        }

        let active = self.active.as_ref().expect("active profile was validated");
        let root = active.root.clone();
        let lock = active.lock.clone();
        let snapshot = active.bookmarks.snapshot.clone();
        let base_generation = snapshot.generation();
        let mutation_revision = active.bookmarks.mutation_revision;
        let id = ProfileBookmarksSaveId(self.next_bookmarks_save_id);
        self.next_bookmarks_save_id = self
            .next_bookmarks_save_id
            .checked_add(1)
            .ok_or(ProfileBookmarksRuntimeError::SaveIdExhausted)?;
        self.pending_bookmarks_save = Some(PendingProfileBookmarksSave {
            id,
            profile,
            base_generation,
            mutation_revision,
        });
''',
          )
          replace_once(
              'src/profile_runtime/bookmarks_persistence.rs',
              '''        let expected = self
            .active
            .as_ref()
            .and_then(|active| active.bookmarks.pending_save.map(|pending| pending.id));
        if expected != Some(save) {
            return Err(ProfileBookmarksRuntimeError::StaleSave {
                expected,
                actual: save,
            });
        }
        self.active
            .as_mut()
            .expect("pending bookmarks save requires an active profile")
            .bookmarks
            .pending_save = None;
        Ok(())
''',
              '''        let expected = self.pending_bookmarks_save.map(|pending| pending.id);
        if expected != Some(save) {
            return Err(ProfileBookmarksRuntimeError::StaleSave {
                expected,
                actual: save,
            });
        }
        self.pending_bookmarks_save = None;
        Ok(())
''',
          )
          replace_once(
              'src/profile_runtime/bookmarks_persistence.rs',
              '''        let expected = self
            .active
            .as_ref()
            .and_then(|active| active.bookmarks.pending_save.map(|pending| pending.id));
        if expected != Some(completion.id) {
            return Err(ProfileBookmarksRuntimeError::StaleSave {
                expected,
                actual: completion.id,
            });
        }

        let active = self
            .active
            .as_mut()
            .expect("pending bookmarks save requires an active profile");
        let pending = active
            .bookmarks
            .pending_save
            .expect("pending bookmarks save was validated");
        if active.id != completion.profile
            || active.root != completion.root
            || pending.base_generation != completion.base_generation
            || pending.mutation_revision != completion.mutation_revision
        {
            return Err(ProfileBookmarksRuntimeError::SaveTargetMismatch {
                save: completion.id,
            });
        }

        active.bookmarks.pending_save = None;
        if let Ok(saved) = &completion.result {
            let current_generation = active.bookmarks.snapshot.generation();
            let saved_generation = saved.snapshot().generation();
            if !active
                .bookmarks
                .snapshot
                .advance_generation_after_save(pending.base_generation, saved_generation)
            {
                return Err(ProfileBookmarksRuntimeError::SaveGenerationMismatch {
                    expected_generation: pending.base_generation,
                    current_generation,
                    saved_generation,
                });
            }
            active.bookmarks.durable_revision = pending.mutation_revision;
        }
''',
              '''        let expected = self.pending_bookmarks_save.map(|pending| pending.id);
        if expected != Some(completion.id) {
            return Err(ProfileBookmarksRuntimeError::StaleSave {
                expected,
                actual: completion.id,
            });
        }

        let pending = self
            .pending_bookmarks_save
            .expect("pending bookmarks save was validated");
        let active = self
            .active
            .as_ref()
            .ok_or(ProfileBookmarksRuntimeError::SaveTargetMismatch {
                save: completion.id,
            })?;
        if pending.profile != completion.profile
            || pending.base_generation != completion.base_generation
            || pending.mutation_revision != completion.mutation_revision
            || active.id != completion.profile
            || active.root != completion.root
        {
            return Err(ProfileBookmarksRuntimeError::SaveTargetMismatch {
                save: completion.id,
            });
        }

        self.pending_bookmarks_save = None;
        if let Ok(saved) = &completion.result {
            let active = self
                .active
                .as_mut()
                .expect("bookmarks save target was validated");
            let current_generation = active.bookmarks.snapshot.generation();
            let saved_generation = saved.snapshot().generation();
            if !active
                .bookmarks
                .snapshot
                .advance_generation_after_save(pending.base_generation, saved_generation)
            {
                return Err(ProfileBookmarksRuntimeError::SaveGenerationMismatch {
                    expected_generation: pending.base_generation,
                    current_generation,
                    saved_generation,
                });
            }
            active.bookmarks.durable_revision = pending.mutation_revision;
        }
''',
          )
          replace_once(
              'src/profile_runtime/bookmarks_persistence.rs',
              '        runtime.active.as_mut().unwrap().bookmarks.next_save_id = u64::MAX;\n',
              '        runtime.next_bookmarks_save_id = u64::MAX;\n',
          )

          Path('.github/workflows/z3-bookmarks-save-id-one-shot.yml').unlink()
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          git diff --check
      - name: Commit hardened identity lifecycle
        shell: bash
        run: |
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add src/profile_runtime.rs src/profile_runtime/bookmarks_persistence.rs .github/workflows/z3-bookmarks-save-id-one-shot.yml
          git diff --cached --stat
          git commit -m "refactor: make bookmark save ids process-monotonic"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
