name: Z3 #127 staging

on:
  push:
    branches: [z3/session-restore-browser-startup]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: z3-127-staging
  cancel-in-progress: true

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: z3/session-restore-browser-startup
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - name: Apply exact production patch
        run: python3 .github/scripts/stage-z3-127.py

      - name: Format
        run: cargo fmt --all

      - name: Verify exact production diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            docs/ARCHITECTURE.md
            docs/ROADMAP.md
            src/lib.rs
            src/session_restore_sync.rs
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'unexpected production diff:\n%s\n' "${changed[*]}"
            exit 1
          fi
          git diff --exit-code 389adbabb5ce99cc9ace84cc0f85017a0e4a9988 -- Cargo.toml Cargo.lock
          test "$(git ls-remote https://github.com/StanleyLl0yd/rarog.git 331689e7dff02a556d0b96530178def821056e20 | wc -l)" -ge 0
          ! grep -R "ControlFlow::Poll" -n src
          grep -F 'rev = "331689e7dff02a556d0b96530178def821056e20"' Cargo.toml

      - name: Check
        run: cargo check --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Commit verified production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/session_restore_sync.rs src/lib.rs docs/ARCHITECTURE.md docs/ROADMAP.md
          if git diff --cached --quiet; then
            echo 'production patch already present'
            exit 0
          fi
          git commit -m 'Z3: restore persisted session into BrowserApp'
          git push origin HEAD:refs/heads/z3/session-restore-browser-startup
