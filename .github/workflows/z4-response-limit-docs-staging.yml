name: Z4 response-limit documentation sync

on:
  push:
    branches: [z4/network-response-limit-binding]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          ref: z4/network-response-limit-binding
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Synchronize response-limit docs
        shell: bash
        run: |
          python3 .github/z4_response_limit_docs_patch.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo test --locked
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ARCHITECTURE.md docs/ROADMAP.md docs/Z4_SECURITY_BOUNDARIES.md src/privileged_request.rs
          git diff --cached --quiet && { echo 'no documentation patch produced'; exit 1; }
          git commit -m "docs: bind bounded Network response-body limit"
          git push origin HEAD:z4/network-response-limit-binding
