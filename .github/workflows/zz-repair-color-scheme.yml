name: One-shot color scheme repair

on:
  push:
    branches:
      - z3/native-color-scheme-setting

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Apply exact repair
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src/platform/windows.rs")
          text = path.read_text(encoding="utf-8")

          function = text.index("fn spawn_http_smoke_server()")
          start = text.index("            let response = format!(\n", function)
          end = text.index("                HTTP_SMOKE_BODY.len(),", start)
          response = (
              '            let response = format!(\n'
              '                "HTTP/1.1 200 OK\\\\r\\\\nContent-Type: text/html; charset=utf-8\\\\r\\\\nContent-Length: {}\\\\r\\\\nConnection: close\\\\r\\\\n\\\\r\\\\n{}",\n'
          )
          text = text[:start] + response + text[end:]

          stray = "                debug_assert_eq!(returned.id(), pending.intent.id());\n"
          if stray not in text:
              raise SystemExit("expected stray catalog assertion was not found")
          text = text.replace(stray, "", 1)

          with path.open("w", encoding="utf-8", newline="\n") as handle:
              handle.write(text)
          '@ | python -

          cargo fmt --all
          git diff --check

          if (-not (git diff --quiet -- src/platform/windows.rs)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/platform/windows.rs
            git commit -m "fix: clean native color scheme validation"
            git push
          }
