name: Z4 specialized privileged admission validation

on:
  push:
    branches: [z4/remove-generic-privileged-admission]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          ref: z4/remove-generic-privileged-admission
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate specialized-only privileged admission
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          git diff --check

          forbidden=(
            'EnginePrivilegedRequestKind'
            'EnginePrivilegedRequestDecision'
            'preflight_privileged_request'
            'NetworkTargetRequired'
            'ClipboardOperationRequired'
          )
          for symbol in "${forbidden[@]}"; do
            if git grep -n -F "$symbol" -- src docs README.md; then
              echo "obsolete generic privileged symbol remains: $symbol" >&2
              exit 1
            fi
          done

          if git grep -n -E '(^|[^A-Za-z0-9_])EnginePrivilegedRequest([^A-Za-z0-9_]|$)' -- src docs README.md; then
            echo 'obsolete generic EnginePrivilegedRequest handle remains' >&2
            exit 1
          fi
          if git grep -n -F 'pub fn preflight_once(' -- src; then
            echo 'obsolete generic tracker preflight remains' >&2
            exit 1
          fi
          if git grep -n -F 'pub fn register(' -- src/privileged_request.rs; then
            echo 'obsolete generic tracker registration remains' >&2
            exit 1
          fi
