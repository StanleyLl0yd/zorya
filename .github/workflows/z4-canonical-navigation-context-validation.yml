name: Z4 canonical navigation context validation

on:
  push:
    branches: [z4/canonical-navigation-context-authority]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          ref: z4/canonical-navigation-context-authority
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate canonical navigation context authority
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          git diff --check

          if git grep -n -E 'NavigationContextId::try_new\([^)]*navigation_context\(\).*get\(\)' -- src; then
            echo 'numeric NavigationContextId reconstruction remains' >&2
            exit 1
          fi
          if ! git grep -n -F 'navigation_context: NavigationContextId' -- src/engine.rs; then
            echo 'authority does not retain canonical NavigationContextId' >&2
            exit 1
          fi
          if ! git grep -n -F 'pub(crate) const fn rarog_navigation_context' -- src/engine.rs; then
            echo 'crate-private canonical context accessor missing' >&2
            exit 1
          fi
