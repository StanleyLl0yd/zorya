name: Z4 privileged discard validation

on:
  push:
    branches: [z4/privileged-request-discard]
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Diff check
        run: git diff --check 78b40b844654ce215cae1bd212eb9f99bd4a7547..HEAD
      - name: Enforce specialized discard surface
        shell: python
        run: |
          from pathlib import Path
          source = Path("src/privileged_request.rs").read_text(encoding="utf-8")
          required = [
              "pub fn discard_network_once(",
              "pub fn discard_clipboard_once(",
              "fn consume_network_exact(",
              "fn consume_clipboard_exact(",
              "let stored = self.consume_network_exact(request)?;",
              "let stored = self.consume_clipboard_exact(request)?;",
          ]
          for needle in required:
              if needle not in source:
                  raise SystemExit(f"missing expected discard contract: {needle}")
          forbidden = [
              "pub fn discard_once(",
              "pub fn discard_privileged",
              "pub fn discard_request_id",
          ]
          for needle in forbidden:
              if needle in source:
                  raise SystemExit(f"generic discard surface must remain absent: {needle}")
