name: Security rustls lock closure

on:
  push:
    branches: [security/rustls-0.23.45]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/rustls-0.23.45
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Update rustls lock entry
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p rustls --precise 0.23.45
          test -z "$(git diff --name-only -- Cargo.toml)"
          changed="$(git diff --name-only)"
          test "$changed" = "Cargo.lock"
          python3 - <<'PY'
          from pathlib import Path
          text = Path("Cargo.lock").read_text()
          marker = 'name = "rustls"\nversion = "0.23.45"'
          if marker not in text:
              raise SystemExit("rustls 0.23.45 not resolved")
          if 'name = "rustls"\nversion = "0.23.44"' in text:
              raise SystemExit("vulnerable rustls 0.23.44 still present")
          PY
      - name: Check locked graph
        run: cargo check --locked --all-targets
      - name: Test locked graph
        run: cargo test --locked
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked graph
        run: cargo audit
      - name: Commit lock-only fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "Cargo.lock"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "security: update rustls to 0.23.45"
          git push origin HEAD:security/rustls-0.23.45
