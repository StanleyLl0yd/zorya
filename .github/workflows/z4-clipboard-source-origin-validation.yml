name: Z4 Clipboard source origin validation

on:
  push:
    branches: [z4/clipboard-source-origin-binding]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          ref: z4/clipboard-source-origin-binding
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate Clipboard canonical source binding
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          git diff --check

          git grep -n -F 'source: EngineCommittedDocumentSource' -- src/privileged_request.rs
          git grep -n -F 'source: &EngineCommittedDocumentSource' -- src/privileged_request.rs
          git grep -n -F 'self.committed_document_source(source.tab())' -- src/privileged_request.rs
          git grep -n -F 'source_origin(&self) -> &rarog_url::Origin' -- src/privileged_request.rs

          if git grep -n -F 'authority: EngineCommittedDocumentAuthority' -- src/privileged_request.rs; then
            echo 'Clipboard/request tracker still stores bare committed authority' >&2
            exit 1
          fi
          if git grep -n -F 'register_clipboard_read(current.authority())' -- src; then
            echo 'Clipboard read still registers from bare authority' >&2
            exit 1
          fi
          if git grep -n -F 'register_clipboard_write(current.authority()' -- src; then
            echo 'Clipboard write still registers from bare authority' >&2
            exit 1
          fi
          if git grep -n -F 'bound only to an `EngineCommittedDocumentAuthority`' -- docs; then
            echo 'docs still describe Clipboard as authority-only' >&2
            exit 1
          fi
