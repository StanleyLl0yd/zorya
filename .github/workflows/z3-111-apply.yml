name: Z3 111 apply

on:
  push:
    branches: [z3/session-restore-storage]
    paths: [.github/workflows/z3-111-apply.yml]
  workflow_dispatch:

permissions: {}

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout topic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: z3/session-restore-storage
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply focused transform
        run: python scripts/z3_111_apply.py
      - name: Format
        run: cargo fmt --all
      - name: Verify format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Verify invariants and patch hygiene
        shell: bash
        run: |
          git diff --exit-code f0f664d4f7b6f729fb7bcd91100b28a1a2e562ec -- Cargo.toml Cargo.lock
          grep -F '331689e7dff02a556d0b96530178def821056e20' Cargo.toml
          if grep -R -F 'ControlFlow::Poll' src; then
            echo 'ControlFlow::Poll is forbidden' >&2
            exit 1
          fi
          git diff --check
      - name: Commit verified implementation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add src/session_restore.rs src/lib.rs docs/ROADMAP.md docs/ARCHITECTURE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add recoverable session restore storage"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:z3/session-restore-storage
