name: Z3 129 staging

on:
  push:
    branches: [z3/native-session-restore-sync]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply native session restore wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/platform/windows.rs')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '    ProfileSessionRestoreSavePolicy, ProfileSessionRestoreSaveScheduler,\n    ProfileSessionRestoreSaveUrgency, ProfileSettingsSavePolicy, ProfileSettingsSaveScheduler,\n',
              '    ProfileSessionRestoreSavePolicy, ProfileSessionRestoreSaveScheduler,\n    ProfileSessionRestoreSaveUrgency, ProfileSessionRestoreSync, ProfileSettingsSavePolicy,\n    ProfileSettingsSaveScheduler,\n',
              'session sync import',
          )
          replace_once(
              'use std::collections::BTreeMap;\n',
              'use std::collections::{BTreeMap, BTreeSet};\n',
              'collections import',
          )
          replace_once(
              '    session_restore_scheduler: ProfileSessionRestoreSaveScheduler,\n    profile_clock: NativeProfileClock,\n',
              '    session_restore_scheduler: ProfileSessionRestoreSaveScheduler,\n    session_restore_sync: Option<ProfileSessionRestoreSync>,\n    profile_clock: NativeProfileClock,\n',
              'session sync field',
          )
          replace_once(
              '    pending_navigation_targets: BTreeMap<TabId, WorkerNavigationTarget>,\n    rapid_smoke_tabs: Vec<TabId>,\n',
              '    pending_navigation_targets: BTreeMap<TabId, WorkerNavigationTarget>,\n    materialized_tabs: BTreeSet<TabId>,\n    rapid_smoke_tabs: Vec<TabId>,\n',
              'materialized tabs field',
          )
          replace_once(
              '    initial_navigation: Option<NavigationId>,\n    pending_navigation_cancel: Option<WorkerNavigationTarget>,\n',
              '    initial_navigation: Option<NavigationId>,\n    restored_reload_pending: bool,\n    pending_navigation_cancel: Option<WorkerNavigationTarget>,\n',
              'restored reload field',
          )
          replace_once(
              '            session_restore_scheduler: ProfileSessionRestoreSaveScheduler::new(\n                native_session_restore_save_policy(),\n            ),\n            profile_clock: NativeProfileClock::new(),\n',
              '            session_restore_scheduler: ProfileSessionRestoreSaveScheduler::new(\n                native_session_restore_save_policy(),\n            ),\n            session_restore_sync: None,\n            profile_clock: NativeProfileClock::new(),\n',
              'session sync init',
          )
          replace_once(
              '            pending_navigation_targets: BTreeMap::new(),\n            rapid_smoke_tabs: Vec::new(),\n',
              '            pending_navigation_targets: BTreeMap::new(),\n            materialized_tabs: BTreeSet::new(),\n            rapid_smoke_tabs: Vec::new(),\n',
              'materialized tabs init',
          )
          replace_once(
              '            initial_navigation: Some(initial_navigation),\n            pending_navigation_cancel: None,\n',
              '            initial_navigation: Some(initial_navigation),\n            restored_reload_pending: false,\n            pending_navigation_cancel: None,\n',
              'restored reload init',
          )

          marker = '''    fn profile_transition_in_progress(&self) -> bool {\n'''
          helpers = '''    fn install_active_profile_session_restore(&mut self) -> Result<(), String> {\n        let profile = self.active_profile_id()?;\n        let startup = ProfileSessionRestoreSync::restore_browser(&self.profile_runtime, profile)\n            .map_err(|error| format!("failed to restore active browser session: {error}"))?;\n        let restored = startup.restored();\n        let (mut browser, mut sync) = startup.into_parts();\n        let first_sync = sync\n            .synchronize(&mut self.profile_runtime, &browser)\n            .map_err(|error| format!("failed to validate restored browser session: {error}"))?;\n        if first_sync.changed() {\n            return Err(\n                "restored browser session changed persisted state during first synchronization"\n                    .into(),\n            );\n        }\n\n        let native_target = browser.windows().find_map(|window| {\n            window\n                .active_tab_id()\n                .map(|tab| (window.id(), tab))\n        });\n        let (browser_window, tab) = match native_target {\n            Some(target) => target,\n            None if restored => {\n                let window = browser\n                    .create_window()\n                    .map_err(|error| format!("failed to append native restore window: {error}"))?;\n                let tab = browser\n                    .create_tab(window)\n                    .map_err(|error| format!("failed to append native restore tab: {error}"))?;\n                (window, tab)\n            }\n            None => {\n                return Err(\n                    "empty session bootstrap did not provide an active native tab".into(),\n                );\n            }\n        };\n\n        let has_committed_location = browser\n            .window(browser_window)\n            .and_then(|window| window.tab(tab))\n            .and_then(|tab| tab.navigation().current_entry())\n            .is_some();\n        let initial_navigation = if has_committed_location {\n            None\n        } else {\n            Some(\n                browser\n                    .begin_navigation(browser_window, tab, START_LOCATION)\n                    .map_err(|error| format!("failed to begin native bootstrap navigation: {error}"))?\n                    .intent()\n                    .id(),\n            )\n        };\n\n        self.browser = browser;\n        self.browser_window = browser_window;\n        self.tab = tab;\n        self.presentation = TabPresentationHandoff::new(tab);\n        self.session_restore_sync = Some(sync);\n        self.materialized_tabs.clear();\n        self.materialized_tabs.insert(tab);\n        self.initial_navigation = initial_navigation;\n        self.restored_reload_pending = has_committed_location;\n        Ok(())\n    }\n\n    fn synchronize_session_restore(&mut self) -> Result<bool, String> {\n        if self.shutdown_requested {\n            return Ok(false);\n        }\n        let profile = self.active_profile_id()?;\n        let outcome = {\n            let sync = self\n                .session_restore_sync\n                .as_mut()\n                .ok_or_else(|| "native session restore synchronization is not installed".to_string())?;\n            if sync.profile() != profile {\n                return Err(format!(\n                    "native session restore synchronization belongs to profile {} instead of active profile {}",\n                    sync.profile().get(),\n                    profile.get()\n                ));\n            }\n            sync.synchronize(&mut self.profile_runtime, &self.browser)\n                .map_err(|error| format!("failed to synchronize native session restore: {error}"))?\n        };\n        if outcome.changed() {\n            self.drive_session_restore_save(ProfileSessionRestoreSaveUrgency::Normal)?;\n        }\n        Ok(outcome.changed())\n    }\n\n    fn start_restored_reload_if_ready(&mut self) -> Result<bool, String> {\n        if !self.restored_reload_pending\n            || !self.worker_ready\n            || self.profile_transition_in_progress()\n        {\n            return Ok(false);\n        }\n        if !self.materialized_tabs.contains(&self.tab) {\n            return Err(format!(\n                "restored native tab {} has no materialized Rarog View",\n                self.tab.get()\n            ));\n        }\n        let active = self\n            .browser\n            .window(self.browser_window)\n            .and_then(|window| window.active_tab_id());\n        if active != Some(self.tab) {\n            return Err(\n                "restored native presentation target is not the committed active tab".into(),\n            );\n        }\n        let start = self\n            .browser\n            .begin_reload(self.browser_window, self.tab)\n            .map_err(|error| format!("failed to begin restored page reload: {error}"))?\n            .ok_or_else(|| "restored active tab has no committed page to reload".to_string())?;\n        self.dispatch_navigation_start(self.tab, start)?;\n        self.restored_reload_pending = false;\n        Ok(true)\n    }\n\n'''
          replace_once(marker, helpers + marker, 'session restore helpers')

          old_smoke = '''    fn run_session_restore_persistence_smoke(\n        &mut self,\n        event_loop: &ActiveEventLoop,\n    ) -> Result<(), String> {\n        if self.run_mode != RunMode::ExitAfterSessionRestorePersistence {\n            return Err("session-restore persistence smoke started outside its run mode".into());\n        }\n        let profile = self.active_profile_id()?;\n        let marker_count = self\n            .profile_runtime\n            .active_session_restore(profile)\n            .map_err(|error| format!("failed to inspect active session restore: {error}"))?\n            .windows()\n            .iter()\n            .flat_map(|window| window.tabs().iter())\n            .filter(|tab| tab.location() == SESSION_RESTORE_PERSISTENCE_SMOKE_LOCATION)\n            .count();\n        if marker_count > 1 {\n            return Err(\n                "session-restore persistence smoke found duplicate persisted markers".into(),\n            );\n        }\n        if marker_count == 0 {\n            let window = self\n                .profile_runtime\n                .add_session_window(profile)\n                .map_err(|error| format!("failed to create session smoke window: {error}"))?;\n            self.profile_runtime\n                .add_session_tab(profile, window, SESSION_RESTORE_PERSISTENCE_SMOKE_LOCATION)\n                .map_err(|error| format!("failed to create session smoke tab: {error}"))?;\n        }\n        self.shutdown(event_loop);\n        Ok(())\n    }\n'''
          new_smoke = '''    fn run_session_restore_persistence_smoke(\n        &mut self,\n        event_loop: &ActiveEventLoop,\n    ) -> Result<(), String> {\n        if self.run_mode != RunMode::ExitAfterSessionRestorePersistence {\n            return Err("session-restore persistence smoke started outside its run mode".into());\n        }\n        let profile = self.active_profile_id()?;\n        let persisted_markers = self\n            .profile_runtime\n            .active_session_restore(profile)\n            .map_err(|error| format!("failed to inspect active session restore: {error}"))?\n            .windows()\n            .iter()\n            .flat_map(|window| {\n                window.tabs().iter().filter_map(move |tab| {\n                    (tab.location() == SESSION_RESTORE_PERSISTENCE_SMOKE_LOCATION)\n                        .then_some((window.id(), tab.id()))\n                })\n            })\n            .collect::<Vec<_>>();\n\n        match persisted_markers.as_slice() {\n            [] => {\n                let browser_window = self\n                    .browser\n                    .create_window()\n                    .map_err(|error| format!("failed to create session smoke browser window: {error}"))?;\n                let browser_tab = self\n                    .browser\n                    .create_tab(browser_window)\n                    .map_err(|error| format!("failed to create session smoke browser tab: {error}"))?;\n                let navigation = self\n                    .browser\n                    .begin_navigation(\n                        browser_window,\n                        browser_tab,\n                        SESSION_RESTORE_PERSISTENCE_SMOKE_LOCATION,\n                    )\n                    .map_err(|error| format!("failed to begin session smoke browser navigation: {error}"))?\n                    .intent()\n                    .id();\n                self.browser\n                    .commit_navigation(\n                        browser_window,\n                        browser_tab,\n                        navigation,\n                        SESSION_RESTORE_PERSISTENCE_SMOKE_LOCATION,\n                    )\n                    .map_err(|error| format!("failed to commit session smoke browser navigation: {error}"))?;\n                if !self.synchronize_session_restore()? {\n                    return Err(\n                        "session-restore persistence smoke did not publish the BrowserApp marker"\n                            .into(),\n                    );\n                }\n                let sync = self\n                    .session_restore_sync\n                    .as_ref()\n                    .ok_or_else(|| "session-restore persistence smoke lost sync bindings".to_string())?;\n                if sync.session_window(browser_window).is_none()\n                    || sync.session_tab(browser_window, browser_tab).is_none()\n                {\n                    return Err(\n                        "session-restore persistence smoke did not bind the BrowserApp marker"\n                            .into(),\n                    );\n                }\n            }\n            [(persisted_window, persisted_tab)] => {\n                let restored_markers = self\n                    .browser\n                    .windows()\n                    .flat_map(|window| {\n                        window.tabs().iter().filter_map(move |tab| {\n                            tab.navigation()\n                                .current_entry()\n                                .is_some_and(|entry| {\n                                    entry.location() == SESSION_RESTORE_PERSISTENCE_SMOKE_LOCATION\n                                })\n                                .then_some((window.id(), tab.id()))\n                        })\n                    })\n                    .collect::<Vec<_>>();\n                let [(browser_window, browser_tab)] = restored_markers.as_slice() else {\n                    return Err(format!(\n                        "session-restore persistence smoke expected one restored BrowserApp marker, found {}",\n                        restored_markers.len()\n                    ));\n                };\n                let sync = self\n                    .session_restore_sync\n                    .as_ref()\n                    .ok_or_else(|| "session-restore persistence smoke lost restored bindings".to_string())?;\n                if sync.session_window(*browser_window) != Some(*persisted_window)\n                    || sync.session_tab(*browser_window, *browser_tab) != Some(*persisted_tab)\n                {\n                    return Err(\n                        "session-restore persistence smoke restored the marker with incorrect persisted bindings"\n                            .into(),\n                    );\n                }\n                if self.synchronize_session_restore()? {\n                    return Err(\n                        "session-restore persistence smoke changed an exactly restored marker".into(),\n                    );\n                }\n            }\n            _ => {\n                return Err(\n                    "session-restore persistence smoke found duplicate persisted markers".into(),\n                );\n            }\n        }\n\n        self.shutdown(event_loop);\n        Ok(())\n    }\n'''
          replace_once(old_smoke, new_smoke, 'session persistence smoke')

          old_reset = '''    fn reset_native_session_for_profile_switch(&mut self) -> Result<(), String> {\n        if self.pending_profile_session_reset.is_pending() {\n            return Err("profile session reset is already pending".into());\n        }\n        if !self.profile_replacement_browser_quiescent() {\n            return Err("profile session reset requires a quiescent browser".into());\n        }\n        let fresh_tab = self\n            .browser\n            .reset_window_for_profile_switch(self.browser_window)\n            .map_err(|error| {\n                format!("failed to reset browser session for profile switch: {error}")\n            })?;\n        self.tab = fresh_tab;\n        self.presentation = TabPresentationHandoff::new(fresh_tab);\n        self.pending_target_permit = None;\n        self.surface_recovery_permit = None;\n        self.pending_tab_create = None;\n        self.pending_view_close = None;\n        self.pending_navigation_targets.clear();\n        self.rapid_smoke_tabs.clear();\n        self.restore_focus_after_activation = false;\n        self.pending_navigation_cancel = None;\n        self.pending_frame.invalidate();\n        self.pending_surface.invalidate();\n\n        let navigation = self\n            .browser\n            .begin_navigation(self.browser_window, fresh_tab, START_LOCATION)\n            .map_err(|error| format!("failed to begin fresh profile navigation: {error}"))?\n            .intent()\n            .id();\n        self.initial_navigation = Some(navigation);\n        let target = self\n            .requests\n            .allocate(self.browser_window, fresh_tab)\n            .map_err(|error| error.to_string())?;\n        self.pending_profile_session_reset\n            .begin(target)\n            .map_err(|error| error.to_string())?;\n        self.worker_ready = false;\n        self.needs_redraw = true;\n\n        let result = self\n            .worker\n            .as_ref()\n            .ok_or_else(|| "render worker is unavailable for profile session reset".to_string())?\n            .reset_profile_session(target, self.presentation.generation());\n        if let Err(error) = result {\n            self.pending_profile_session_reset\n                .complete_if_current(target);\n            return Err(error);\n        }\n        self.profile_cycle_smoke_trace("session reset submitted");\n        Ok(())\n    }\n'''
          new_reset = '''    fn reset_native_session_for_profile_switch(&mut self) -> Result<(), String> {\n        if self.pending_profile_session_reset.is_pending() {\n            return Err("profile session reset is already pending".into());\n        }\n        let profile = self.active_profile_id()?;\n        let sync = self\n            .session_restore_sync\n            .as_ref()\n            .ok_or_else(|| "profile session reset requires installed restore bindings".to_string())?;\n        if sync.profile() != profile {\n            return Err("profile session reset restore bindings belong to another profile".into());\n        }\n        if !self.materialized_tabs.contains(&self.tab) {\n            return Err("profile session reset target is not materialized".into());\n        }\n\n        self.presentation = TabPresentationHandoff::new(self.tab);\n        self.pending_target_permit = None;\n        self.surface_recovery_permit = None;\n        self.pending_tab_create = None;\n        self.pending_view_close = None;\n        self.pending_navigation_targets.clear();\n        self.rapid_smoke_tabs.clear();\n        self.restore_focus_after_activation = false;\n        self.pending_navigation_cancel = None;\n        self.pending_frame.invalidate();\n        self.pending_surface.invalidate();\n\n        let target = self\n            .requests\n            .allocate(self.browser_window, self.tab)\n            .map_err(|error| error.to_string())?;\n        self.pending_profile_session_reset\n            .begin(target)\n            .map_err(|error| error.to_string())?;\n        self.worker_ready = false;\n        self.needs_redraw = true;\n\n        let result = self\n            .worker\n            .as_ref()\n            .ok_or_else(|| "render worker is unavailable for profile session reset".to_string())?\n            .reset_profile_session(target, self.presentation.generation());\n        if let Err(error) = result {\n            self.pending_profile_session_reset\n                .complete_if_current(target);\n            return Err(error);\n        }\n        self.profile_cycle_smoke_trace("session reset submitted");\n        Ok(())\n    }\n'''
          replace_once(old_reset, new_reset, 'profile reset')

          old_commit = '''            Ok(commit) => {\n                if let Some(replaced) = commit.into_replaced_profile() {\n                    debug_assert!(self.pending_profile_replacement.is_none());\n                    self.replaced_profile_lock = Some(replaced.into_profile_lock());\n                    self.profile_cycle_smoke_trace("selection committed");\n                    if let Err(error) = self.reset_native_session_for_profile_switch() {\n                        self.fail(event_loop, error);\n                        return;\n                    }\n                    match self.drive_replaced_profile_lock_release() {\n                        Ok(true) => {}\n                        Ok(false) => event_loop.set_control_flow(ControlFlow::Wait),\n                        Err(error) => self.fail(event_loop, error),\n                    }\n                } else if let Err(error) = self.initialize(event_loop) {\n                    self.fail(event_loop, error);\n                }\n            }\n'''
          new_commit = '''            Ok(commit) => {\n                let replaced = commit\n                    .into_replaced_profile()\n                    .map(|profile| profile.into_profile_lock());\n                debug_assert!(self.pending_profile_replacement.is_none());\n                self.replaced_profile_lock = replaced;\n                self.profile_cycle_smoke_trace("selection committed");\n                if let Err(error) = self.install_active_profile_session_restore() {\n                    self.fail(event_loop, error);\n                    return;\n                }\n\n                if self.replaced_profile_lock.is_some() {\n                    if let Err(error) = self.reset_native_session_for_profile_switch() {\n                        self.fail(event_loop, error);\n                        return;\n                    }\n                    match self.drive_replaced_profile_lock_release() {\n                        Ok(true) => {}\n                        Ok(false) => event_loop.set_control_flow(ControlFlow::Wait),\n                        Err(error) => self.fail(event_loop, error),\n                    }\n                } else if let Err(error) = self.initialize(event_loop) {\n                    self.fail(event_loop, error);\n                }\n            }\n'''
          replace_once(old_commit, new_commit, 'profile commit restore install')

          old_lock_tail = '''                        } else if self.needs_redraw\n                            && !self.profile_transition_in_progress()\n                            && let Err(error) = self.start_frame()\n                        {\n                            self.fail(event_loop, error);\n                        }\n'''
          new_lock_tail = '''                        } else {\n                            let replay_started = match self.start_restored_reload_if_ready() {\n                                Ok(started) => started,\n                                Err(error) => {\n                                    self.fail(event_loop, error);\n                                    return;\n                                }\n                            };\n                            if !replay_started\n                                && self.needs_redraw\n                                && !self.profile_transition_in_progress()\n                                && let Err(error) = self.start_frame()\n                            {\n                                self.fail(event_loop, error);\n                            }\n                        }\n'''
          replace_once(old_lock_tail, new_lock_tail, 'replacement lock release replay')

          old_activation = '''    fn begin_native_tab_activation(&mut self, start: TabActivationStart) -> Result<(), String> {\n        let intent = start.intent();\n        if intent.from() == intent.to() {\n'''
          new_activation = '''    fn begin_native_tab_activation(&mut self, start: TabActivationStart) -> Result<(), String> {\n        let intent = start.intent();\n        if !self.materialized_tabs.contains(&intent.to()) {\n            if start.superseded().is_some() {\n                return Err(\n                    "unmaterialized tab activation superseded an existing native handoff".into(),\n                );\n            }\n            self.browser\n                .cancel_tab_activation(self.browser_window, intent.id())\n                .map_err(|error| format!("failed to cancel unmaterialized tab activation: {error}"))?;\n            return Ok(());\n        }\n        if intent.from() == intent.to() {\n'''
          replace_once(old_activation, new_activation, 'activation materialization guard')
          replace_once(
              '''        self.tab = committed;\n        self.pending_target_permit = Some(permit);\n        self.dispatch_pending_target_frame()\n''',
              '''        self.tab = committed;\n        self.synchronize_session_restore()?;\n        self.pending_target_permit = Some(permit);\n        self.dispatch_pending_target_frame()\n''',
              'activation synchronization',
          )

          old_cycle = '''            BrowserCommand::CycleTab(direction) => {\n                if self.pending_tab_create.is_some() {\n                    return Ok(());\n                }\n'''
          new_cycle = '''            BrowserCommand::CycleTab(direction) => {\n                if self.pending_tab_create.is_some() {\n                    return Ok(());\n                }\n                if self.browser.window(self.browser_window).is_some_and(|window| {\n                    window\n                        .tabs()\n                        .iter()\n                        .any(|tab| !self.materialized_tabs.contains(&tab.id()))\n                }) {\n                    return Ok(());\n                }\n'''
          replace_once(old_cycle, new_cycle, 'cycle materialization guard')

          replace_once(
              '''        let profile = self.active_profile_id()?;\n        self.record_navigation_commit(profile, commit)?;\n\n        if pending.activate_after_create {\n''',
              '''        let profile = self.active_profile_id()?;\n        self.record_navigation_commit(profile, commit)?;\n        self.materialized_tabs.insert(target.tab());\n        self.synchronize_session_restore()?;\n\n        if pending.activate_after_create {\n''',
              'new tab synchronization',
          )

          old_close_closed = '''            TabCloseStart::Closed(result) => {\n                let closed = result.tab().id();\n                if closed == self.tab {\n                    return Err("active native tab closed without a presentation handoff".into());\n                }\n                self.worker\n'''
          new_close_closed = '''            TabCloseStart::Closed(result) => {\n                let closed = result.tab().id();\n                if closed == self.tab {\n                    return Err("active native tab closed without a presentation handoff".into());\n                }\n                self.synchronize_session_restore()?;\n                self.worker\n'''
          replace_once(old_close_closed, new_close_closed, 'background close sync')

          old_close_active = '''            TabCloseStart::ActiveWithFallback(close) => {\n                let intent = close.activation().intent();\n                self.presentation\n'''
          new_close_active = '''            TabCloseStart::ActiveWithFallback(close) => {\n                let intent = close.activation().intent();\n                if !self.materialized_tabs.contains(&close.fallback_tab()) {\n                    self.browser\n                        .cancel_tab_activation(self.browser_window, intent.id())\n                        .map_err(|error| {\n                            format!("failed to cancel close fallback without native View: {error}")\n                        })?;\n                    return Ok(());\n                }\n                self.presentation\n'''
          replace_once(old_close_active, new_close_active, 'close fallback guard')
          replace_once(
              '''                if committed != close.fallback_tab() {\n                    return Err(format!(\n                        "active close committed fallback tab {} instead of {}",\n                        committed.get(),\n                        close.fallback_tab().get()\n                    ));\n                }\n\n                self.presentation\n''',
              '''                if committed != close.fallback_tab() {\n                    return Err(format!(\n                        "active close committed fallback tab {} instead of {}",\n                        committed.get(),\n                        close.fallback_tab().get()\n                    ));\n                }\n                self.synchronize_session_restore()?;\n\n                self.presentation\n''',
              'active close synchronization',
          )

          replace_once(
              '''                    Ok(()) => {\n                        self.pending_view_close = None;\n                        self.pending_navigation_targets.remove(&tab);\n''',
              '''                    Ok(()) => {\n                        self.pending_view_close = None;\n                        self.pending_navigation_targets.remove(&tab);\n                        self.materialized_tabs.remove(&tab);\n''',
              'view close materialization retirement',
          )

          old_initialized = '''                    Ok(()) => {\n                        if let Err(error) = self.commit_initial_navigation() {\n                            self.fail(event_loop, error);\n                            return;\n                        }\n                        self.worker_ready = true;\n                        self.needs_redraw = true;\n                        self.request_redraw();\n                    }\n'''
          new_initialized = '''                    Ok(()) => {\n                        if self.initial_navigation.is_some()\n                            && let Err(error) = self.commit_initial_navigation()\n                        {\n                            self.fail(event_loop, error);\n                            return;\n                        }\n                        self.worker_ready = true;\n                        self.needs_redraw = true;\n                        match self.start_restored_reload_if_ready() {\n                            Ok(true) => {}\n                            Ok(false) => self.request_redraw(),\n                            Err(error) => self.fail(event_loop, error),\n                        }\n                    }\n'''
          replace_once(old_initialized, new_initialized, 'initial worker restored replay')

          old_reset_event = '''                    Ok(()) => {\n                        if let Err(error) = self.commit_initial_navigation() {\n                            self.fail(event_loop, error);\n                            return;\n                        }\n                        self.worker_ready = true;\n                        self.needs_redraw = true;\n                        if let Err(error) = self.apply_active_color_scheme_preference() {\n                            self.fail(event_loop, error);\n                            return;\n                        }\n                        self.update_window_title();\n                        if !self.profile_transition_in_progress()\n                            && let Err(error) = self.start_frame()\n                        {\n                            self.fail(event_loop, error);\n                        }\n                    }\n'''
          new_reset_event = '''                    Ok(()) => {\n                        if self.initial_navigation.is_some()\n                            && let Err(error) = self.commit_initial_navigation()\n                        {\n                            self.fail(event_loop, error);\n                            return;\n                        }\n                        self.worker_ready = true;\n                        self.needs_redraw = true;\n                        if let Err(error) = self.apply_active_color_scheme_preference() {\n                            self.fail(event_loop, error);\n                            return;\n                        }\n                        self.update_window_title();\n                        let replay_started = match self.start_restored_reload_if_ready() {\n                            Ok(started) => started,\n                            Err(error) => {\n                                self.fail(event_loop, error);\n                                return;\n                            }\n                        };\n                        if !replay_started\n                            && !self.profile_transition_in_progress()\n                            && let Err(error) = self.start_frame()\n                        {\n                            self.fail(event_loop, error);\n                        }\n                    }\n'''
          replace_once(old_reset_event, new_reset_event, 'reset worker restored replay')

          replace_once(
              '''                        if let Err(error) = self.record_navigation_commit(target.profile, commit) {\n                            self.fail(event_loop, error);\n                            return;\n                        }\n                        self.clear_navigation_target_if_current(target);\n''',
              '''                        if let Err(error) = self.record_navigation_commit(target.profile, commit) {\n                            self.fail(event_loop, error);\n                            return;\n                        }\n                        if let Err(error) = self.synchronize_session_restore() {\n                            self.fail(event_loop, error);\n                            return;\n                        }\n                        self.clear_navigation_target_if_current(target);\n''',
              'committed navigation synchronization',
          )

          replace_once(
              '''        let profile = self.active_profile_id()?;\n        self.record_navigation_commit(profile, commit)?;\n        self.initial_navigation = None;\n        Ok(())\n''',
              '''        let profile = self.active_profile_id()?;\n        self.record_navigation_commit(profile, commit)?;\n        self.initial_navigation = None;\n        self.synchronize_session_restore()?;\n        Ok(())\n''',
              'initial blank synchronization',
          )

          old_begin_nav = '''                WorkerCommand::BeginNavigation { target, location } => {\n                    if let Err(message) = worker.begin_navigation(target, location) {\n                        if proxy\n                            .send_event(WorkerEvent::NavigationFinished {\n                                target,\n                                outcome: WorkerNavigationOutcome::InternalFailure { message },\n                            })\n                            .is_err()\n                        {\n                            return;\n                        }\n                    }\n                }\n'''
          new_begin_nav = '''                WorkerCommand::BeginNavigation { target, location } => {\n                    if location == START_LOCATION {\n                        let outcome = match worker.load_local_navigation(target) {\n                            Ok(()) => WorkerNavigationOutcome::Committed {\n                                location,\n                                status: 200,\n                                source_bytes: START_PAGE.len(),\n                            },\n                            Err(message) => WorkerNavigationOutcome::InternalFailure { message },\n                        };\n                        if proxy\n                            .send_event(WorkerEvent::NavigationFinished { target, outcome })\n                            .is_err()\n                        {\n                            return;\n                        }\n                    } else if let Err(message) = worker.begin_navigation(target, location)\n                        && proxy\n                            .send_event(WorkerEvent::NavigationFinished {\n                                target,\n                                outcome: WorkerNavigationOutcome::InternalFailure { message },\n                            })\n                            .is_err()\n                    {\n                        return;\n                    }\n                }\n'''
          replace_once(old_begin_nav, new_begin_nav, 'local about blank worker navigation')

          marker = '''    fn begin_navigation(\n        &mut self,\n        target: WorkerNavigationTarget,\n        location: String,\n    ) -> Result<(), String> {\n'''
          local_method = '''    fn load_local_navigation(&mut self, target: WorkerNavigationTarget) -> Result<(), String> {\n        self.ensure_active()?;\n        if target.window != self.window || !self.engine.has_view(target.tab) {\n            return Err(format!(\n                "local navigation {} targeted unavailable window {} tab {}",\n                target.navigation.get(),\n                target.window.get(),\n                target.tab.get()\n            ));\n        }\n        if self.pending_navigations.contains_key(&target.tab) {\n            return Err(format!(\n                "local navigation {} overlapped pending worker navigation for tab {}",\n                target.navigation.get(),\n                target.tab.get()\n            ));\n        }\n        self.engine\n            .load_local_html(target.tab, START_PAGE)\n            .map_err(|error| format!("failed to reload local start document: {error}"))\n    }\n\n'''
          replace_once(marker, local_method + marker, 'local worker navigation method')

          old_reset_validate = '''        self.validate_new_request(target)?;\n\n        let mut engine =\n            EngineHost::new().map_err(|error| format!("failed to reset Rarog: {error}"))?;\n'''
          new_reset_validate = '''        if target.request().get() <= self.last_request_id {\n            return Err(format!(\n                "stale profile reset request {} targeted window {} tab {}",\n                target.request().get(),\n                target.window().get(),\n                target.tab().get()\n            ));\n        }\n        self.last_request_id = target.request().get();\n\n        let mut engine =\n            EngineHost::new().map_err(|error| format!("failed to reset Rarog: {error}"))?;\n'''
          replace_once(old_reset_validate, new_reset_validate, 'profile reset target validation')
          replace_once(
              '''        self.engine = engine;\n        self.pending_navigations.clear();\n        self.tab = target.tab();\n''',
              '''        self.engine = engine;\n        self.pending_navigations.clear();\n        self.window = target.window();\n        self.tab = target.tab();\n''',
              'profile reset window replacement',
          )

          path.write_text(text)

          arch = Path('docs/ARCHITECTURE.md')
          arch_text = arch.read_text()
          old_arch = 'Native startup wiring must establish this restored browser/binding pair before enabling live synchronization, so an initial blank browser cannot overwrite a persisted session.'
          new_arch = 'Windows startup and profile replacement now establish this restored browser/binding pair immediately after profile commit and require the first synchronization to be a no-op before native initialization/reset can proceed. The single native presentation selects the first restored window with an active tab while preserving every other restored window/tab in the portable model; all-empty restored sessions append one unbound native bootstrap tab only after the no-op validation. Only materialized tabs may enter native activation/close fallback, committed browser mutations synchronize back through the exact bindings, changed synchronization schedules normal session persistence, and restored committed pages are replayed through the existing Reload lifecycle after the worker is ready. Shutdown never synchronizes its native teardown close back over the session already being flushed.'
          if arch_text.count(old_arch) != 1:
              raise SystemExit('architecture paragraph anchor mismatch')
          arch.write_text(arch_text.replace(old_arch, new_arch, 1))

          roadmap = Path('docs/ROADMAP.md')
          road_text = roadmap.read_text()
          old_road = 'native startup/synchronization wiring remains later Z3 work;'
          new_road = 'Windows native startup/profile replacement now installs that exact restored BrowserApp+binding pair before initialization/reset, validates a no-op first sync, presents only a materialized restored tab while preserving the remaining restored model, replays restored committed pages through Reload after worker readiness, synchronizes committed blank/navigation/new-tab/activation/close mutations with changed-only normal save driving, and the two-run native smoke proves BrowserApp restoration plus exact persisted binding without teardown clobber;'
          if road_text.count(old_road) != 1:
              raise SystemExit('roadmap anchor mismatch')
          roadmap.write_text(road_text.replace(old_road, new_road, 1))
          PY
          cargo fmt --all
          rm .github/workflows/z3-129-stage.yml
      - name: Commit production patch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Z3: wire restored session into Windows native lifecycle"
          git push origin HEAD:z3/native-session-restore-sync
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  linux:
    needs: patch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.patch.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets

  windows:
    needs: patch
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.patch.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --bin zorya
      - name: Session restore persistence/reload smoke
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "zorya-session-restore-z3-129"
          if (Test-Path -LiteralPath $smokeRoot) { Remove-Item -LiteralPath $smokeRoot -Recurse -Force }
          $previousLocalAppData = $env:LOCALAPPDATA
          $env:LOCALAPPDATA = $smokeRoot
          try {
            foreach ($attempt in 1..2) {
              $process = Start-Process -FilePath ".\\target\\debug\\zorya.exe" -ArgumentList "--native-session-restore-persistence-smoke" -PassThru -NoNewWindow
              if (-not $process.WaitForExit(60000)) { $process.Kill(); throw "session restore smoke attempt $attempt timed out" }
              if ($process.ExitCode -ne 0) { throw "session restore smoke attempt $attempt failed with exit code $($process.ExitCode)" }
            }
          } finally {
            $env:LOCALAPPDATA = $previousLocalAppData
          }
      - name: Profile switch smoke
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\\target\\debug\\zorya.exe" -ArgumentList "--native-profile-cycle-smoke" -PassThru -NoNewWindow
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw "profile cycle smoke timed out" }
          if ($process.ExitCode -ne 0) { throw "profile cycle smoke failed with exit code $($process.ExitCode)" }

  invariants:
    needs: patch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.patch.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - shell: bash
        run: |
          set -euo pipefail
          base=24a19d4c3beae8f1fb12b20cf83995da58c5e89f
          test "$(git diff --name-only "$base"..HEAD | sort | tr '\n' ' ')" = "docs/ARCHITECTURE.md docs/ROADMAP.md src/platform/windows.rs "
          test -z "$(git diff "$base"..HEAD -- Cargo.toml Cargo.lock)"
          grep -R "331689e7dff02a556d0b96530178def821056e20" Cargo.toml Cargo.lock >/dev/null
          ! grep -R "ControlFlow::Poll" src
          test ! -e .github/workflows/z3-129-stage.yml
          git diff --check "$base"..HEAD
