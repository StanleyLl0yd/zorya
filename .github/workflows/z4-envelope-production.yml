name: Z4 Network envelope production patch

on:
  push:
    branches: [z4/network-request-envelope]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply exact production patch
        shell: bash
        run: |
          if grep -q 'MAX_PRIVILEGED_NETWORK_DESTINATION_BYTES' src/privileged_request.rs; then
            echo 'production envelope patch already present'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          def add_defaults_to_request_literals(text):
              needle = 'EngineNetworkPrivilegedRequest {'
              cursor = 0
              out = []
              changed = 0
              while True:
                  start = text.find(needle, cursor)
                  if start < 0:
                      out.append(text[cursor:])
                      break
                  out.append(text[cursor:start])
                  brace = text.find('{', start)
                  depth = 0
                  end = None
                  for i in range(brace, len(text)):
                      if text[i] == '{':
                          depth += 1
                      elif text[i] == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break
                  if end is None:
                      raise SystemExit('unterminated EngineNetworkPrivilegedRequest block')
                  block = text[start:end]
                  if 'target:' in block and 'mode:' not in block:
                      lines = block.splitlines(keepends=True)
                      target_i = next((i for i, line in enumerate(lines) if line.lstrip().startswith('target:')), None)
                      if target_i is None:
                          raise SystemExit('request literal target field not found')
                      indent = lines[target_i][:len(lines[target_i]) - len(lines[target_i].lstrip())]
                      lines[target_i:target_i] = [
                          f'{indent}mode: RequestMode::Cors,\n',
                          f'{indent}credentials: CredentialsMode::SameOrigin,\n',
                          f'{indent}redirect: RedirectMode::Follow,\n',
                          f'{indent}destination: RequestDestination::Empty,\n',
                      ]
                      block = ''.join(lines)
                      changed += 1
                  out.append(block)
                  cursor = end
              return ''.join(out), changed

          p = Path('src/privileged_request.rs')
          text = p.read_text()
          text = text.replace(
              'use rarog_fetch::{FetchMethod, HeaderList};',
              'use rarog_fetch::{\n    CredentialsMode, FetchMethod, HeaderList, RedirectMode, RequestDestination, RequestMode,\n};',
              1,
          )
          if 'CredentialsMode' not in text[:600]:
              raise SystemExit('failed to bind Rarog envelope imports')

          text = text.replace(
              'pub const MAX_PRIVILEGED_NETWORK_BODY_BYTES: usize = 1024 * 1024;',
              'pub const MAX_PRIVILEGED_NETWORK_BODY_BYTES: usize = 1024 * 1024;\npub const MAX_PRIVILEGED_NETWORK_DESTINATION_BYTES: usize = 256;',
              1,
          )

          old = '''/// One-shot Network request bound to the exact source authority, canonical method, bounded
          /// canonical headers, exact optional bounded body and raw target.
          ///
          /// Target, header and body contents are retained only in process memory and are deliberately not
          /// included in `Debug` output because they can contain sensitive data. Body bytes use immutable
          /// shared storage so cloning a request handle does not duplicate the body allocation. The HTTP
          /// method and headers use canonical Rarog Fetch types; Zorya does not parse or normalize them
          /// independently. Registration does not parse or authorize the target; canonical target policy
          /// runs only when the request is consumed.'''
          new = '''/// One-shot Network request bound to the exact source authority, canonical method, bounded
          /// canonical headers, exact optional bounded body, canonical Fetch envelope metadata and raw target.
          ///
          /// Target, header/body and custom destination contents are retained only in process memory and are
          /// deliberately not included in `Debug` output because they can contain sensitive data. Body bytes
          /// use immutable shared storage so cloning a request handle does not duplicate the body allocation.
          /// Method, headers, mode, credentials, redirect and destination use canonical Rarog Fetch types;
          /// Zorya does not parse or normalize them independently. Registration does not parse or authorize
          /// the target; canonical target policy runs only when the request is consumed.'''
          if text.count(old) != 1:
              raise SystemExit('Network request documentation marker changed')
          text = text.replace(old, new, 1)

          old = '''    headers: HeaderList,
              body: Option<Arc<[u8]>>,
              target: String,'''
          new = '''    headers: HeaderList,
              body: Option<Arc<[u8]>>,
              mode: RequestMode,
              credentials: CredentialsMode,
              redirect: RedirectMode,
              destination: RequestDestination,
              target: String,'''
          if text.count(old) != 1:
              raise SystemExit('request struct shape changed')
          text = text.replace(old, new, 1)

          old = '''    pub fn body(&self) -> Option<&[u8]> {
                  self.body.as_deref()
              }

              pub fn target(&self) -> &str {'''
          new = '''    pub fn body(&self) -> Option<&[u8]> {
                  self.body.as_deref()
              }

              pub const fn mode(&self) -> RequestMode {
                  self.mode
              }

              pub const fn credentials(&self) -> CredentialsMode {
                  self.credentials
              }

              pub const fn redirect(&self) -> RedirectMode {
                  self.redirect
              }

              pub fn destination(&self) -> &RequestDestination {
                  &self.destination
              }

              pub fn target(&self) -> &str {'''
          if text.count(old) != 1:
              raise SystemExit('request getter shape changed')
          text = text.replace(old, new, 1)

          old = '''    fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  formatter
                      .debug_struct("EngineNetworkPrivilegedRequest")'''
          new = '''    fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  let (destination_kind, destination_other_bytes) = match &self.destination {
                      RequestDestination::Empty => ("empty", 0),
                      RequestDestination::Document => ("document", 0),
                      RequestDestination::Script => ("script", 0),
                      RequestDestination::Style => ("style", 0),
                      RequestDestination::Image => ("image", 0),
                      RequestDestination::Font => ("font", 0),
                      RequestDestination::Other(value) => ("other", value.len()),
                  };
                  formatter
                      .debug_struct("EngineNetworkPrivilegedRequest")'''
          if text.count(old) != 1:
              raise SystemExit('request Debug shape changed')
          text = text.replace(old, new, 1)

          old = '''            .field("body_present", &self.body.is_some())
                      .field("body_bytes", &self.body_bytes())
                      .finish()'''
          new = '''            .field("body_present", &self.body.is_some())
                      .field("body_bytes", &self.body_bytes())
                      .field("mode", &self.mode)
                      .field("credentials", &self.credentials)
                      .field("redirect", &self.redirect)
                      .field("destination_kind", &destination_kind)
                      .field("destination_other_bytes", &destination_other_bytes)
                      .finish()'''
          if text.count(old) != 1:
              raise SystemExit('request Debug tail changed')
          text = text.replace(old, new, 1)

          old = '''    NetworkBodyTooLong {
                  bytes: usize,
                  max: usize,
              },
              NetworkBodyBudgetExceeded {'''
          new = '''    NetworkBodyTooLong {
                  bytes: usize,
                  max: usize,
              },
              NetworkDestinationTooLong {
                  bytes: usize,
                  max: usize,
              },
              NetworkBodyBudgetExceeded {'''
          if text.count(old) != 1:
              raise SystemExit('error enum marker changed')
          text = text.replace(old, new, 1)

          marker = '''            Self::NetworkBodyBudgetExceeded {
          '''
          insert = '''            Self::NetworkDestinationTooLong { bytes, max } => write!(
                  formatter,
                  "Network privileged request destination is {bytes} bytes; maximum is {max} bytes"
              ),
          '''
          if text.count(marker) != 1:
              raise SystemExit(f'error Display insertion marker changed: {text.count(marker)}')
          text = text.replace(marker, insert + marker, 1)

          tracker_marker = '\n/// Bounded process-local lifecycle for future privileged request attempts.'
          helper_end = text.find(tracker_marker)
          if helper_end < 0:
              raise SystemExit('tracker marker missing')
          destination_helper = '''

          fn bind_network_destination(
              destination: RequestDestination,
          ) -> Result<RequestDestination, EnginePrivilegedRequestError> {
              if let RequestDestination::Other(value) = &destination {
                  if value.len() > MAX_PRIVILEGED_NETWORK_DESTINATION_BYTES {
                      return Err(EnginePrivilegedRequestError::NetworkDestinationTooLong {
                          bytes: value.len(),
                          max: MAX_PRIVILEGED_NETWORK_DESTINATION_BYTES,
                      });
                  }
              }
              Ok(destination)
          }
          '''
          if 'fn bind_network_destination(' in text:
              raise SystemExit('destination helper unexpectedly present')
          text = text[:helper_end] + destination_helper + text[helper_end:]

          text = text.replace(
              '/// bounded canonical Rarog headers and exact optional bounded body. Consumption removes the exact\n/// stored request and releases its tracker-accounted body bytes before source/target policy.',
              '/// bounded canonical Rarog headers, exact optional bounded body and canonical Fetch envelope\n/// metadata. Consumption removes the exact stored request and releases its tracker-accounted body\n/// bytes before source/target policy.',
              1,
          )

          start_marker = '''    /// Registers a bounded raw Network target, canonical method/headers and exact optional body
              /// without target parsing, source revalidation or authorization.'''
          start = text.find(start_marker)
          end_marker = '    /// Consumes an exact generic request before checking its source authority.'
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Network registration block markers changed')
          replacement = '''    /// Registers a bounded raw Network target, canonical method/headers and exact optional body
              /// with the pinned Rarog Fetch envelope defaults.
              ///
              /// This compatibility path remains exact: it binds `Cors`, `SameOrigin`, `Follow` and
              /// `Empty`, matching `rarog_fetch::FetchRequest::try_new` at the pinned Rarog revision.
              pub fn register_network_with_method_headers_and_body(
                  &mut self,
                  source: &EngineCommittedDocumentSource,
                  method: FetchMethod,
                  target: impl Into<String>,
                  headers: HeaderList,
                  body: Option<Vec<u8>>,
              ) -> Result<EngineNetworkPrivilegedRequest, EnginePrivilegedRequestError> {
                  self.register_network_with_request_parts(
                      source,
                      method,
                      target,
                      headers,
                      body,
                      RequestMode::Cors,
                      CredentialsMode::SameOrigin,
                      RedirectMode::Follow,
                      RequestDestination::Empty,
                  )
              }

              /// Registers the exact bounded current Network request envelope without target parsing,
              /// source revalidation or authorization.
              ///
              /// Incoming headers are rebound through Rarog `HeaderList::append` into fixed product
              /// limits. Body/method compatibility reuses Rarog `FetchMethod::permits_body`; mode,
              /// credentials, redirect and destination remain canonical pinned-Rarog Fetch values.
              /// `RequestDestination::Other` is retained byte-for-byte but capped before request-ID,
              /// pending-slot or tracker body-budget consumption. Deferring target parsing until
              /// consumption preserves stale-source-before-target classification.
              #[allow(clippy::too_many_arguments)]
              pub fn register_network_with_request_parts(
                  &mut self,
                  source: &EngineCommittedDocumentSource,
                  method: FetchMethod,
                  target: impl Into<String>,
                  headers: HeaderList,
                  body: Option<Vec<u8>>,
                  mode: RequestMode,
                  credentials: CredentialsMode,
                  redirect: RedirectMode,
                  destination: RequestDestination,
              ) -> Result<EngineNetworkPrivilegedRequest, EnginePrivilegedRequestError> {
                  let target = target.into();
                  if target.len() > MAX_PRIVILEGED_NETWORK_TARGET_BYTES {
                      return Err(EnginePrivilegedRequestError::NetworkTargetTooLong {
                          bytes: target.len(),
                          max: MAX_PRIVILEGED_NETWORK_TARGET_BYTES,
                      });
                  }
                  let destination = bind_network_destination(destination)?;
                  let headers = bind_network_headers(&headers)?;
                  let body = bind_network_body(&method, body)?;
                  let body_bytes = body.as_ref().map_or(0, |body| body.len());
                  let next_body_bytes = self
                      .pending_network_body_bytes
                      .checked_add(body_bytes)
                      .ok_or(EnginePrivilegedRequestError::NetworkBodyBudgetExceeded {
                          pending: self.pending_network_body_bytes,
                          requested: body_bytes,
                          max: self.max_pending_network_body_bytes,
                      })?;
                  if next_body_bytes > self.max_pending_network_body_bytes {
                      return Err(EnginePrivilegedRequestError::NetworkBodyBudgetExceeded {
                          pending: self.pending_network_body_bytes,
                          requested: body_bytes,
                          max: self.max_pending_network_body_bytes,
                      });
                  }
                  self.ensure_capacity()?;

                  let id = allocate_privileged_request_id()?;
                  let request = EngineNetworkPrivilegedRequest {
                      id,
                      source: source.clone(),
                      method,
                      headers,
                      body,
                      mode,
                      credentials,
                      redirect,
                      destination,
                      target,
                  };
                  self.insert_pending(id, PendingPrivilegedRequest::Network(request.clone()));
                  self.pending_network_body_bytes = next_body_bytes;
                  Ok(request)
              }

          '''
          text = text[:start] + replacement + text[end:]

          text = text.replace(
              '    /// Consumes the exact target/method/header/body-bound Network request before applying canonical\n    /// target policy.',
              '    /// Consumes the exact source/target/method/header/body/envelope-bound Network request before\n    /// applying canonical target policy.',
              1,
          )
          text = text.replace(
              '    /// Same-ID source, method, headers, body or target mismatches burn the stored slot. Stored body\n',
              '    /// Same-ID source, method, headers, body, mode, credentials, redirect, destination or target\n    /// mismatches burn the stored slot. Stored body\n',
              1,
          )
          text = text.replace(
              '    /// target. The current policy remains non-authorizing; retained method/headers/body are\n    /// correlation data for a later reviewed Fetch/broker path and are not executed here.',
              '    /// target. The current policy remains non-authorizing; retained method/headers/body/envelope\n    /// metadata are correlation data for a later reviewed Fetch/broker path and are not executed here.',
              1,
          )

          module_marker = '''#[cfg(test)]
          #[path = "privileged_request_network_origin_tests.rs"]
          mod network_origin_tests;'''
          module_replacement = '''#[cfg(test)]
          #[path = "privileged_request_network_envelope_tests.rs"]
          mod network_envelope_tests;

          #[cfg(test)]
          #[path = "privileged_request_network_origin_tests.rs"]
          mod network_origin_tests;'''
          if text.count(module_marker) != 1:
              raise SystemExit('origin test module marker changed')
          text = text.replace(module_marker, module_replacement, 1)

          marker = '#[cfg(test)]\nmod tests {'
          head, sep, tests = text.partition(marker)
          if not sep:
              raise SystemExit('inline tests marker missing')
          tests, changed = add_defaults_to_request_literals(tests)
          if changed < 1:
              raise SystemExit('expected forged request literals in inline tests')
          p.write_text(head + sep + tests)

          for test_path in [
              'src/privileged_request_network_body_tests.rs',
              'src/privileged_request_network_origin_tests.rs',
          ]:
              tp = Path(test_path)
              updated, changed = add_defaults_to_request_literals(tp.read_text())
              if changed < 1:
                  raise SystemExit(f'{test_path}: expected forged request literal')
              tp.write_text(updated)

          replace_once(
              'src/lib.rs',
              '''    EnginePrivilegedRequestTracker, MAX_PRIVILEGED_NETWORK_BODY_BYTES,
              MAX_PRIVILEGED_NETWORK_HEADER_BYTES, MAX_PRIVILEGED_NETWORK_HEADERS,
              MAX_PRIVILEGED_NETWORK_TARGET_BYTES,''',
              '''    EnginePrivilegedRequestTracker, MAX_PRIVILEGED_NETWORK_BODY_BYTES,
              MAX_PRIVILEGED_NETWORK_DESTINATION_BYTES, MAX_PRIVILEGED_NETWORK_HEADER_BYTES,
              MAX_PRIVILEGED_NETWORK_HEADERS, MAX_PRIVILEGED_NETWORK_TARGET_BYTES,''',
          )

          tests = r'''use super::*;
          use crate::engine::EngineNavigationPoll;
          use crate::{BrowserApp, BrowserWindow, TabId};
          use std::io::{Read, Write};
          use std::net::TcpListener;
          use std::thread;
          use std::time::{Duration, Instant};

          fn initial_tab() -> TabId {
              let app = BrowserApp::bootstrap().expect("browser bootstrap");
              app.windows()
                  .next()
                  .and_then(BrowserWindow::active_tab_id)
                  .expect("bootstrap creates an active tab")
          }

          fn serve_once(path: &str) -> String {
              let listener = TcpListener::bind(("127.0.0.1", 0)).expect("bind envelope fixture");
              let port = listener.local_addr().expect("fixture address").port();
              thread::spawn(move || {
                  let (mut stream, _) = listener.accept().expect("accept envelope fixture request");
                  stream
                      .set_read_timeout(Some(Duration::from_secs(2)))
                      .expect("fixture read timeout");
                  let mut request = [0u8; 4096];
                  let _ = stream.read(&mut request);
                  let response = b"HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=utf-8\r\nContent-Length: 18\r\nConnection: close\r\n\r\n<main>Zorya</main>";
                  let _ = stream.write_all(response);
                  let _ = stream.flush();
              });
              format!("http://127.0.0.1:{port}{path}")
          }

          fn commit_remote(
              host: &mut EngineHost,
              tab: TabId,
              location: String,
          ) -> EngineCommittedDocumentSource {
              let request = host
                  .begin_navigation(tab, location)
                  .expect("begin remote navigation")
                  .expect("remote navigation forwarded");
              let deadline = Instant::now() + Duration::from_secs(5);
              loop {
                  match host.poll_navigation(request).expect("poll remote navigation") {
                      EngineNavigationPoll::Pending if Instant::now() < deadline => {
                          thread::sleep(Duration::from_millis(5));
                      }
                      EngineNavigationPoll::Pending => panic!("envelope fixture timed out"),
                      EngineNavigationPoll::Committed { .. } => break,
                      EngineNavigationPoll::Failed { message } => {
                          panic!("envelope fixture navigation failed: {message}")
                      }
                      EngineNavigationPoll::Stale => panic!("envelope fixture navigation went stale"),
                  }
              }
              host.committed_document_source(tab)
                  .expect("committed source query")
                  .expect("committed remote source")
          }

          fn current_source(path: &str) -> (TabId, EngineHost, EngineCommittedDocumentSource) {
              let tab = initial_tab();
              let mut host = EngineHost::new().expect("engine host");
              host.create_view(tab).expect("view");
              let source = commit_remote(&mut host, tab, serve_once(path));
              (tab, host, source)
          }

          #[test]
          fn convenience_defaults_and_explicit_fetch_metadata_are_bound_exactly() {
              let (_tab, host, current) = current_source("/envelope-binding");
              let mut tracker = EnginePrivilegedRequestTracker::try_new(2).expect("tracker");

              let defaults = tracker
                  .register_network(&current, "http://127.0.0.1:1/default-envelope")
                  .expect("register default envelope");
              assert_eq!(defaults.mode(), RequestMode::Cors);
              assert_eq!(defaults.credentials(), CredentialsMode::SameOrigin);
              assert_eq!(defaults.redirect(), RedirectMode::Follow);
              assert_eq!(defaults.destination(), &RequestDestination::Empty);
              assert_eq!(
                  tracker.preflight_network_once(&host, defaults),
                  Ok(EngineNetworkTargetDecision::DeniedUnsupported)
              );

              let destination = RequestDestination::Other(String::from("zorya-subresource"));
              let request = tracker
                  .register_network_with_request_parts(
                      &current,
                      FetchMethod::post(),
                      "http://127.0.0.1:1/explicit-envelope",
                      HeaderList::default(),
                      Some(vec![1]),
                      RequestMode::NoCors,
                      CredentialsMode::Include,
                      RedirectMode::Manual,
                      destination.clone(),
                  )
                  .expect("register explicit envelope");
              assert_eq!(request.mode(), RequestMode::NoCors);
              assert_eq!(request.credentials(), CredentialsMode::Include);
              assert_eq!(request.redirect(), RedirectMode::Manual);
              assert_eq!(request.destination(), &destination);
              assert_eq!(
                  tracker.preflight_network_once(&host, request),
                  Ok(EngineNetworkTargetDecision::DeniedUnsupported)
              );
          }

          #[test]
          fn every_fetch_metadata_substitution_burns_once_and_releases_body_budget() {
              let (_tab, host, current) = current_source("/envelope-mismatch");

              for case in 0..4 {
                  let mut tracker = EnginePrivilegedRequestTracker::try_new_with_body_budget(1, 4)
                      .expect("tracker");
                  let request = tracker
                      .register_network_with_request_parts(
                          &current,
                          FetchMethod::post(),
                          "http://127.0.0.1:1/envelope-mismatch",
                          HeaderList::default(),
                          Some(vec![1, 2, 3, 4]),
                          RequestMode::Cors,
                          CredentialsMode::SameOrigin,
                          RedirectMode::Follow,
                          RequestDestination::Empty,
                      )
                      .expect("register envelope request");
                  assert_eq!(tracker.pending_network_body_bytes(), 4);

                  let mut forged = request.clone();
                  match case {
                      0 => forged.mode = RequestMode::SameOrigin,
                      1 => forged.credentials = CredentialsMode::Include,
                      2 => forged.redirect = RedirectMode::Error,
                      3 => forged.destination = RequestDestination::Script,
                      _ => unreachable!(),
                  }
                  assert_eq!(
                      tracker.preflight_network_once(&host, forged),
                      Err(EnginePrivilegedRequestError::MismatchedRequest(request.id()))
                  );
                  assert_eq!(tracker.pending_requests(), 0);
                  assert_eq!(tracker.pending_network_body_bytes(), 0);
                  assert_eq!(
                      tracker.preflight_network_once(&host, request.clone()),
                      Err(EnginePrivilegedRequestError::UnknownRequest(request.id()))
                  );
              }
          }

          #[test]
          fn other_destination_is_exact_and_bounded_before_slot_or_body_budget_use() {
              let (_tab, host, current) = current_source("/destination-bound");
              let mut tracker = EnginePrivilegedRequestTracker::try_new_with_body_budget(1, 1)
                  .expect("tracker");
              let maximum = "x".repeat(MAX_PRIVILEGED_NETWORK_DESTINATION_BYTES);
              let request = tracker
                  .register_network_with_request_parts(
                      &current,
                      FetchMethod::post(),
                      "http://127.0.0.1:1/destination-max",
                      HeaderList::default(),
                      Some(vec![1]),
                      RequestMode::Cors,
                      CredentialsMode::SameOrigin,
                      RedirectMode::Follow,
                      RequestDestination::Other(maximum.clone()),
                  )
                  .expect("maximum destination accepted");
              assert_eq!(request.destination(), &RequestDestination::Other(maximum));
              assert_eq!(tracker.pending_requests(), 1);
              assert_eq!(tracker.pending_network_body_bytes(), 1);
              assert_eq!(
                  tracker.preflight_network_once(&host, request),
                  Ok(EngineNetworkTargetDecision::DeniedUnsupported)
              );
              assert_eq!(tracker.pending_network_body_bytes(), 0);

              let oversized = "y".repeat(MAX_PRIVILEGED_NETWORK_DESTINATION_BYTES + 1);
              assert_eq!(
                  tracker.register_network_with_request_parts(
                      &current,
                      FetchMethod::post(),
                      "http://127.0.0.1:1/destination-oversized",
                      HeaderList::default(),
                      Some(vec![1]),
                      RequestMode::Cors,
                      CredentialsMode::SameOrigin,
                      RedirectMode::Follow,
                      RequestDestination::Other(oversized),
                  ),
                  Err(EnginePrivilegedRequestError::NetworkDestinationTooLong {
                      bytes: MAX_PRIVILEGED_NETWORK_DESTINATION_BYTES + 1,
                      max: MAX_PRIVILEGED_NETWORK_DESTINATION_BYTES,
                  })
              );
              assert_eq!(tracker.pending_requests(), 0);
              assert_eq!(tracker.pending_network_body_bytes(), 0);
          }

          #[test]
          fn destination_other_debug_contents_are_redacted() {
              let (_tab, _host, current) = current_source("/destination-debug");
              let mut tracker = EnginePrivilegedRequestTracker::try_new(1).expect("tracker");
              let secret = "destination-secret-do-not-log";
              let request = tracker
                  .register_network_with_request_parts(
                      &current,
                      FetchMethod::get(),
                      "http://127.0.0.1:1/destination-debug",
                      HeaderList::default(),
                      None,
                      RequestMode::Navigate,
                      CredentialsMode::Omit,
                      RedirectMode::Error,
                      RequestDestination::Other(secret.to_owned()),
                  )
                  .expect("register debug request");
              let debug = format!("{request:?}");

              assert!(!debug.contains(secret));
              assert!(debug.contains("destination_kind"));
              assert!(debug.contains("other"));
              assert!(debug.contains("destination_other_bytes"));
              assert!(debug.contains(&secret.len().to_string()));
              assert!(debug.contains("Navigate"));
              assert!(debug.contains("Omit"));
              assert!(debug.contains("Error"));
          }

          #[test]
          fn stale_source_still_precedes_target_classification_for_explicit_envelope() {
              let (tab, mut host, first) = current_source("/envelope-stale-first");
              let mut tracker = EnginePrivilegedRequestTracker::try_new_with_body_budget(1, 3)
                  .expect("tracker");
              let request = tracker
                  .register_network_with_request_parts(
                      &first,
                      FetchMethod::post(),
                      "../relative",
                      HeaderList::default(),
                      Some(vec![1, 2, 3]),
                      RequestMode::SameOrigin,
                      CredentialsMode::Include,
                      RedirectMode::Manual,
                      RequestDestination::Document,
                  )
                  .expect("register raw target with explicit envelope");
              let replacement = commit_remote(&mut host, tab, serve_once("/envelope-stale-second"));
              assert_ne!(replacement.navigation_context(), first.navigation_context());

              assert_eq!(
                  tracker.preflight_network_once(&host, request),
                  Ok(EngineNetworkTargetDecision::DeniedStaleAuthority)
              );
              assert_eq!(tracker.pending_network_body_bytes(), 0);
              assert_eq!(tracker.pending_requests(), 0);
          }
          '''
