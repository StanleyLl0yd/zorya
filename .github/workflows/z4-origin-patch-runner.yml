name: Z4 origin binding patch runner

on:
  push:
    branches: [z4/network-origin-binding]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply corrected embedded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/z4-origin-patch.yml').read_text()
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          old = "old_ctor = '''        let request = EngineNetworkPrivilegedRequest {\n        id,\n        authority,\n        method,\n        headers,\n        body,\n        target,\n    };'''"
          new = "old_ctor = '''        let request = EngineNetworkPrivilegedRequest {\n            id,\n            source,\n            method,\n            headers,\n            body,\n            target,\n        };'''"
          if script.count(old) != 1:
              raise SystemExit(f'expected one malformed old_ctor block, got {script.count(old)}')
          script = script.replace(old, new, 1)
          old = "new_ctor = '''        let request = EngineNetworkPrivilegedRequest {\n        id,\n        source: source.clone(),\n        method,\n        headers,\n        body,\n        target,\n    };'''"
          new = "new_ctor = '''        let request = EngineNetworkPrivilegedRequest {\n            id,\n            source: source.clone(),\n            method,\n            headers,\n            body,\n            target,\n        };'''"
          if script.count(old) != 1:
              raise SystemExit(f'expected one malformed new_ctor block, got {script.count(old)}')
          script = script.replace(old, new, 1)
          exec(compile(script, 'z4-origin-patch', 'exec'))

          body_path = Path('src/privileged_request_network_body_tests.rs')
          body = body_path.read_text()
          old = 'fn current_authority(path: &str) -> (TabId, EngineHost, EngineCommittedDocumentAuthority) {'
          new = 'fn current_authority(path: &str) -> (TabId, EngineHost, EngineCommittedDocumentSource) {'
          if body.count(old) != 1:
              raise SystemExit(f'body tests: expected one current_authority tuple signature, got {body.count(old)}')
          body_path.write_text(body.replace(old, new, 1))

          engine_path = Path('src/engine.rs')
          engine = engine_path.read_text()
          old = '''        let authority = host
              .committed_document_authority(tab)
              .expect("authority before process loss")
              .expect("remote authority before process loss");'''
          new = '''        let source = host
              .committed_document_source(tab)
              .expect("source before process loss")
              .expect("remote source before process loss");
          let authority = source.authority();'''
          if engine.count(old) != 1:
              raise SystemExit(f'engine tests: expected one process-loss authority fixture, got {engine.count(old)}')
          engine = engine.replace(old, new, 1)
          old = 'host.preflight_network_target(authority, "https://lost.example/resource")'
          new = 'host.preflight_network_target(&source, "https://lost.example/resource")'
          if engine.count(old) != 1:
              raise SystemExit(f'engine tests: expected one stale target call, got {engine.count(old)}')
          engine_path.write_text(engine.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --locked --all-targets
      - name: Test
        run: cargo test --locked
      - name: Commit production patch and remove staging workflows
        shell: bash
        run: |
          rm .github/workflows/z4-origin-patch.yml .github/workflows/z4-origin-patch-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Z4: bind canonical Network source Origin"
          git push origin HEAD:z4/network-origin-binding
