name: Z4 origin binding patch runner

on:
  push:
    branches: [z4/network-origin-binding]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply corrected embedded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/z4-origin-patch.yml').read_text()
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          old = "old_ctor = '''        let request = EngineNetworkPrivilegedRequest {\n        id,\n        authority,\n        method,\n        headers,\n        body,\n        target,\n    };'''"
          new = "old_ctor = '''        let request = EngineNetworkPrivilegedRequest {\n            id,\n            source,\n            method,\n            headers,\n            body,\n            target,\n        };'''"
          if script.count(old) != 1:
              raise SystemExit(f'expected one malformed old_ctor block, got {script.count(old)}')
          script = script.replace(old, new, 1)
          old = "new_ctor = '''        let request = EngineNetworkPrivilegedRequest {\n        id,\n        source: source.clone(),\n        method,\n        headers,\n        body,\n        target,\n    };'''"
          new = "new_ctor = '''        let request = EngineNetworkPrivilegedRequest {\n            id,\n            source: source.clone(),\n            method,\n            headers,\n            body,\n            target,\n        };'''"
          if script.count(old) != 1:
              raise SystemExit(f'expected one malformed new_ctor block, got {script.count(old)}')
          script = script.replace(old, new, 1)
          exec(compile(script, 'z4-origin-patch', 'exec'))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --locked --all-targets
      - name: Test
        run: cargo test --locked
      - name: Commit production patch and remove staging workflows
        shell: bash
        run: |
          rm .github/workflows/z4-origin-patch.yml .github/workflows/z4-origin-patch-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Z4: bind canonical Network source Origin"
          git push origin HEAD:z4/network-origin-binding
