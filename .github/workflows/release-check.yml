name: Release Check

on:
  pull_request:
    paths:
      - ".github/workflows/release-check.yml"
      - ".github/workflows/release.yml"
      - ".github/scripts/package-windows-release.ps1"
      - "docs/releases/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  windows-release-check:
    name: Windows release dry run
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Resolve package version
        id: package
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "cargo metadata failed"
          }
          $package = @($metadata.packages | Where-Object { $_.name -eq "zorya" -and $null -eq $_.source })
          if ($package.Count -ne 1) {
            throw "expected exactly one workspace package named zorya"
          }
          "version=$($package[0].version)" >> $env:GITHUB_OUTPUT
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Build release executable
        run: cargo build --locked --release --bin zorya
      - name: Verify release executable version
        shell: pwsh
        run: |
          $expected = "Zorya ${{ steps.package.outputs.version }}"
          $actual = & .\target\release\zorya.exe --version
          if ($LASTEXITCODE -ne 0) {
            throw "release executable --version failed"
          }
          if ($actual -ne $expected) {
            throw "release executable version mismatch: expected '$expected', got '$actual'"
          }
      - name: Smoke test release native shell
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\target\release\zorya.exe" -ArgumentList "--native-smoke" -PassThru -NoNewWindow
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw "release native shell smoke test timed out"
          }
          if ($process.ExitCode -ne 0) {
            throw "release native shell smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Package release
        id: package_release
        shell: pwsh
        run: |
          .\.github\scripts\package-windows-release.ps1 -Version "${{ steps.package.outputs.version }}"
      - name: Verify release package
        shell: pwsh
        run: |
          $archive = "${{ steps.package_release.outputs.archive }}"
          $checksum = "${{ steps.package_release.outputs.checksum }}"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "release archive is missing"
          }
          if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) {
            throw "release checksum is missing"
          }

          $expectedHash = ((Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+')[0]
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "release archive checksum verification failed"
          }

          $verifyRoot = Join-Path $env:RUNNER_TEMP "zorya-release-verify"
          Remove-Item -LiteralPath $verifyRoot -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archive -DestinationPath $verifyRoot
          $packageRoot = Join-Path $verifyRoot "${{ steps.package_release.outputs.package_name }}"
          foreach ($required in @(
            "zorya.exe",
            "README.md",
            "SECURITY.md",
            "LICENSE",
            "Cargo.lock",
            "RELEASE-NOTES.md",
            "THIRD_PARTY_NOTICES.md"
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $packageRoot $required) -PathType Leaf)) {
              throw "release package is missing $required"
            }
          }
          $licenseRoot = Join-Path $packageRoot "THIRD_PARTY_LICENSES"
          if (-not (Test-Path -LiteralPath $licenseRoot -PathType Container)) {
            throw "release package is missing THIRD_PARTY_LICENSES"
          }
          if (@(Get-ChildItem -LiteralPath $licenseRoot -Recurse -File).Count -eq 0) {
            throw "release package contains no discovered third-party license files"
          }
      - name: Upload release dry-run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zorya-windows-release-check-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
