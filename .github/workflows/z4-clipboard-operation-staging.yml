name: Z4 Clipboard operation staging

on:
  push:
    branches: [z4/clipboard-operation-binding]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          ref: z4/clipboard-operation-binding
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply bounded Clipboard operation patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/z4_clipboard_patch.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          git diff --check
          git status --short
          git add src/privileged_request.rs src/privileged_request_clipboard_tests.rs src/lib.rs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Z4: bind bounded Clipboard operations"
          git push origin HEAD:z4/clipboard-operation-binding
