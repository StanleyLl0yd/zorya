name: Z4 Network FetchRequest validation

on:
  push:
    branches: [z4/network-fetch-request-projection]
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Boundary checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'pub struct EnginePreparedNetworkRequest' src/engine.rs
          grep -q 'FetchRequest::try_new' src/engine.rs
          grep -q 'max_headers: MAX_PRIVILEGED_NETWORK_HEADERS' src/engine.rs
          grep -q 'max_header_bytes: MAX_PRIVILEGED_NETWORK_HEADER_BYTES' src/engine.rs
          grep -q 'max_request_body_bytes: MAX_PRIVILEGED_NETWORK_BODY_BYTES' src/engine.rs
          test "$(grep -c 'start_navigation_context_network_operation' src/engine.rs)" -eq 1
          ! grep -q 'network_request()' src/engine.rs
          ! grep -B 3 'pub struct EnginePreparedNetworkRequest' src/engine.rs | grep -q 'derive.*Clone'
          git diff --exit-code fea0d157aeeb22471c044576bba928f993231073..HEAD -- Cargo.toml Cargo.lock
          grep -q '331689e7dff02a556d0b96530178def821056e20' Cargo.toml
      - name: Diff check
        run: git diff --check fea0d157aeeb22471c044576bba928f993231073..HEAD
