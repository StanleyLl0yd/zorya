name: Z3 109 apply v2

on:
  push:
    branches: [z3/native-bookmark-toggle]
    paths: [.github/workflows/z3-109-apply-v2.yml]
  workflow_dispatch:

permissions: {}

jobs:
  apply-and-verify:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout topic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: z3/native-bookmark-toggle
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply focused transform and remove staging files
        shell: bash
        run: |
          python scripts/z3_109_apply.py
          rm scripts/z3_109_apply.py .github/workflows/z3-109-apply-v2.yml
      - name: Format
        run: cargo fmt --all
      - name: Verify format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Build developer executable
        run: cargo build --locked --bin zorya
      - name: Smoke committed-page bookmark toggle add and reload-remove
        shell: pwsh
        run: |
          & ".github/scripts/smoke-bookmark-toggle.ps1" `
            -Executable ".\target\debug\zorya.exe" `
            -ScratchRoot (Join-Path $env:RUNNER_TEMP "zorya-z3-109-precommit")
      - name: Verify workflow supply chain
        run: python scripts/verify_ci_supply_chain.py
      - name: Verify invariants and patch hygiene
        shell: bash
        run: |
          git diff --exit-code e959cd5a7dc8918d7195cd717a53fd1a53c53bba -- Cargo.toml Cargo.lock
          grep -F '331689e7dff02a556d0b96530178def821056e20' Cargo.toml
          if grep -F 'ControlFlow::Poll' src/platform/windows.rs; then
            echo 'ControlFlow::Poll is forbidden for #109' >&2
            exit 1
          fi
          git diff --check
          test ! -e scripts/z3_109_apply.py
          test ! -e .github/workflows/z3-109-apply-v2.yml
      - name: Commit verified implementation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add native committed-page bookmark toggle"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:z3/native-bookmark-toggle
