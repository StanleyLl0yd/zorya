name: Z4 response-limit product cap fix

on:
  push:
    branches: [z4/network-response-limit-binding]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          ref: z4/network-response-limit-binding
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply product response cap
        shell: bash
        run: |
          python3 .github/z4_response_limit_cap_patch.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/privileged_request.rs src/lib.rs src/privileged_request_network_response_limit_tests.rs
          git diff --cached --quiet && { echo 'no product cap patch produced'; exit 1; }
          git commit -m "Z4: bound Network response-body limit"
          git push origin HEAD:z4/network-response-limit-binding
