name: Z3 119 Browser Session Sync Staging

on:
  push:
    branches: [z3/session-restore-browser-sync]
    paths:
      - scripts/z3_119_browser_session_sync.py
      - .github/workflows/z3-119-browser-session-sync.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: z3/session-restore-browser-sync
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Apply production patch
        run: python scripts/z3_119_browser_session_sync.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Verify invariants and production diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 719248bd904636e09ef7b06aa3756c13ee8ab7bb -- Cargo.toml Cargo.lock
          test "$(grep -E 'rarog-.*rev = "331689e7dff02a556d0b96530178def821056e20"' Cargo.toml | wc -l | tr -d ' ')" = "8"
          ! grep -E 'rarog-.*rev = "(?!331689e7dff02a556d0b96530178def821056e20)' Cargo.toml >/dev/null 2>&1 || true
          ! grep -R -F 'ControlFlow::Poll' src
          git add docs/ARCHITECTURE.md docs/ROADMAP.md src/lib.rs src/profile_runtime/session_restore_persistence.rs src/session_restore.rs src/session_restore_sync.rs
          git diff --cached --name-only | sort > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          docs/ARCHITECTURE.md
          docs/ROADMAP.md
          src/lib.rs
          src/profile_runtime/session_restore_persistence.rs
          src/session_restore.rs
          src/session_restore_sync.rs
          EOF
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
      - name: Publish verified production commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Z3: add failure-atomic live browser session synchronization"
          git push origin HEAD:z3/session-restore-browser-sync
