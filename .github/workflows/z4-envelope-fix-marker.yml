name: Fix Z4 envelope staging marker

on:
  push:
    branches: [z4/network-request-envelope]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Replace brittle Display matcher and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/z4-envelope-patch.yml')
          lines = path.read_text().splitlines(keepends=True)
          start = next((i for i, line in enumerate(lines) if "old_display = '''" in line), None)
          end = next((i for i, line in enumerate(lines) if 'text = text.replace(old_display, new_display, 1)' in line), None)
          if start is None or end is None or end < start:
              raise SystemExit('Display matcher block not found')
          replacement = [
              '          display_marker = "            Self::NetworkBodyBudgetExceeded {"\n',
              '          display_insert = (\n',
              '              "            Self::NetworkDestinationTooLong { bytes, max } => write!(\\n"\n',
              '              "                formatter,\\n"\n',
              '              "                \\"Network privileged request destination is {bytes} bytes; maximum is {max} bytes\\"\\n"\n',
              '              "            ),\\n"\n',
              '          )\n',
              '          if text.count(display_marker) != 1:\n',
              '              raise SystemExit(f"error Display insertion marker changed: {text.count(display_marker)} matches")\n',
              '          text = text.replace(display_marker, display_insert + display_marker, 1)\n',
          ]
          lines[start:end + 1] = replacement
          path.write_text(''.join(lines))
          PY
          rm .github/workflows/z4-envelope-fix-marker.yml
          git diff --check
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add .github/workflows/z4-envelope-patch.yml .github/workflows/z4-envelope-fix-marker.yml
          git commit -m "ci: make Z4 envelope Display patch resilient"
          git push origin HEAD:z4/network-request-envelope
