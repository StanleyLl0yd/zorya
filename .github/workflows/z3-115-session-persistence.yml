name: Z3 115 session persistence staging

on:
  push:
    branches: [z3/session-restore-persistence-lifecycle]
    paths:
      - scripts/z3_115_session_persistence.py
      - .github/workflows/z3-115-session-persistence.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: z3-115-session-persistence-staging
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Verify exact base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 96bfc54ad6a27287985c3c177b28a0187fb42857)" = "96bfc54ad6a27287985c3c177b28a0187fb42857"
      - name: Apply session persistence lifecycle
        shell: bash
        run: |
          set +e
          python3 scripts/z3_115_session_persistence.py > /tmp/z3-115.out 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            cp /tmp/z3-115.out scripts/z3_115_failure.txt
            git add scripts/z3_115_failure.txt
            git commit -m 'chore: capture Z3 #115 staging failure'
            git push
            exit "$status"
          fi
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Verify invariants and production diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 96bfc54ad6a27287985c3c177b28a0187fb42857:Cargo.toml)" = "$(git hash-object Cargo.toml)"
          test "$(git rev-parse 96bfc54ad6a27287985c3c177b28a0187fb42857:Cargo.lock)" = "$(git hash-object Cargo.lock)"
          grep -F 'rev = "331689e7dff02a556d0b96530178def821056e20"' Cargo.toml
          if git grep -n -F 'ControlFlow::Poll' -- src; then
            echo 'ControlFlow::Poll is forbidden' >&2
            exit 1
          fi
          git diff --check
          cat > /tmp/expected-files <<'EOF'
          docs/ARCHITECTURE.md
          docs/ROADMAP.md
          src/lib.rs
          src/platform/windows.rs
          src/profile_runtime.rs
          src/profile_runtime/session_restore_persistence.rs
          src/profile_worker.rs
          src/session_restore.rs
          tests/session_restore_profile_replacement_durability.rs
          tests/session_restore_runtime_persistence.rs
          tests/session_restore_save_identity.rs
          tests/session_restore_worker_persistence.rs
          EOF
          git diff --name-only | sort > /tmp/actual-files
          sort /tmp/expected-files -o /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
      - name: Commit verified production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/ARCHITECTURE.md \
            docs/ROADMAP.md \
            src/lib.rs \
            src/platform/windows.rs \
            src/profile_runtime.rs \
            src/profile_runtime/session_restore_persistence.rs \
            src/profile_worker.rs \
            src/session_restore.rs \
            tests/session_restore_profile_replacement_durability.rs \
            tests/session_restore_runtime_persistence.rs \
            tests/session_restore_save_identity.rs \
            tests/session_restore_worker_persistence.rs
          git diff --cached --exit-code && { echo 'no production changes generated' >&2; exit 1; } || true
          git commit -m 'Z3: add session restore persistence lifecycle'
          git push
