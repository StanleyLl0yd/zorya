version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: "rarog-compositor"
      - dependency-name: "rarog-engine"
      - dependency-name: "rarog-types"
      - dependency-name: "rarog-compositor-wgpu"
      - dependency-name: "rarog-platform-windows"
      - dependency-name: "pollster"
      - dependency-name: "winit"
      - dependency-name: "png"
        versions:
          - ">= 0.18.0"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
