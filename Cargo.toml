[package]
name = "zorya"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Stanley Lloyd", "Zorya Project Contributors"]
description = "A Windows-first web browser powered by the Rarog engine."
repository = "https://github.com/StanleyLl0yd/zorya"
rust-version = "1.85"
publish = false

[dependencies]
rarog-compositor = { git = "https://github.com/StanleyLl0yd/rarog", rev = "b330f94fd43b6b809ec0d784f6d0d7f2cce44989" }
rarog-engine = { git = "https://github.com/StanleyLl0yd/rarog", rev = "b330f94fd43b6b809ec0d784f6d0d7f2cce44989" }
rarog-types = { git = "https://github.com/StanleyLl0yd/rarog", rev = "b330f94fd43b6b809ec0d784f6d0d7f2cce44989" }

[target.'cfg(target_os = "windows")'.dependencies]
pollster = { version = "=0.4.0", default-features = false }
rarog-compositor-wgpu = { git = "https://github.com/StanleyLl0yd/rarog", rev = "b330f94fd43b6b809ec0d784f6d0d7f2cce44989" }
rarog-platform-windows = { git = "https://github.com/StanleyLl0yd/rarog", rev = "b330f94fd43b6b809ec0d784f6d0d7f2cce44989" }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
