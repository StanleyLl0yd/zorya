<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Zorya</title>
  <desc id="desc">A luminous sunrise over a dark horizon framed by a violet orbital arc.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07103b"/>
      <stop offset="0.48" stop-color="#0c1550"/>
      <stop offset="1" stop-color="#150b35"/>
    </linearGradient>
    <radialGradient id="inner" cx="50%" cy="44%" r="62%">
      <stop offset="0" stop-color="#34226f" stop-opacity=".78"/>
      <stop offset=".48" stop-color="#171650" stop-opacity=".54"/>
      <stop offset="1" stop-color="#07103b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5267ff"/>
      <stop offset=".42" stop-color="#6f4cff"/>
      <stop offset=".78" stop-color="#b449ff"/>
      <stop offset="1" stop-color="#ff7a4b"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#704dff"/>
      <stop offset=".6" stop-color="#884cff"/>
      <stop offset="1" stop-color="#7345ef"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="72%" r="72%">
      <stop offset="0" stop-color="#fffbd0"/>
      <stop offset=".32" stop-color="#ffd852"/>
      <stop offset=".72" stop-color="#ff9b2f"/>
      <stop offset="1" stop-color="#ff6b3d"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff5a8"/>
      <stop offset=".38" stop-color="#ffc64d"/>
      <stop offset="1" stop-color="#ff5f56"/>
    </linearGradient>
    <linearGradient id="horizonStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5f55"/>
      <stop offset=".5" stop-color="#fff09a"/>
      <stop offset="1" stop-color="#ff7b4c"/>
    </linearGradient>
    <radialGradient id="moon" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".5" stop-color="#d8c8ff"/>
      <stop offset="1" stop-color="#8e6cff"/>
    </radialGradient>
    <filter id="frameGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sunGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="205" fill="url(#bg)"/>
  <rect x="55" y="55" width="914" height="914" rx="205" fill="url(#inner)" opacity=".72"/>
  <rect x="57" y="57" width="910" height="910" rx="202" fill="none" stroke="url(#frame)" stroke-width="4" filter="url(#frameGlow)" opacity=".96"/>

  <path d="M134 718 C154 390 315 154 512 154 C709 154 870 390 890 718"
        fill="none" stroke="url(#orbit)" stroke-width="3.5" opacity=".96" filter="url(#softGlow)"/>

  <g filter="url(#sunGlow)" stroke="url(#ray)" stroke-linecap="round">
    <path d="M512 482 L512 202" stroke-width="9"/>
    <path d="M467 490 L405 306" stroke-width="5"/>
    <path d="M423 510 L316 338" stroke-width="7"/>
    <path d="M390 545 L244 443" stroke-width="5"/>
    <path d="M370 589 L184 515" stroke-width="6"/>
    <path d="M362 640 L188 640" stroke-width="4"/>
    <path d="M557 490 L619 306" stroke-width="5"/>
    <path d="M601 510 L708 338" stroke-width="7"/>
    <path d="M634 545 L780 443" stroke-width="5"/>
    <path d="M654 589 L840 515" stroke-width="6"/>
    <path d="M662 640 L836 640" stroke-width="4"/>
  </g>

  <circle cx="512" cy="636" r="160" fill="url(#sun)" stroke="#fff2a3" stroke-width="8" filter="url(#sunGlow)"/>

  <path d="M0 798 C250 610 774 610 1024 798 L1024 1024 L0 1024 Z"
        fill="#07103b"/>
  <path d="M0 798 C250 610 774 610 1024 798"
        fill="none" stroke="url(#horizonStroke)" stroke-width="6" filter="url(#softGlow)"/>

  <circle cx="512" cy="154" r="13" fill="url(#moon)" filter="url(#softGlow)"/>
</svg>